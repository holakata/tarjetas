<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<title>Mi tarjeta</title>
<link rel="stylesheet" href="../comun.css">
<style>
  .app { max-width: 460px; margin: 0 auto; padding: 22px 18px 60px; }
  .cab { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mono { width: 46px; height: 46px; border-radius: 14px; background: var(--marca); color: #fff; display: grid; place-items: center; font-family: "Gloock", serif; font-size: 24px; flex: none; }
  .cab h1 { font-family: "Gloock", serif; font-weight: 400; font-size: 24px; line-height: 1.1; }
  .cab p { font-size: 13px; color: var(--tinta-2); }

  .tarjeta { position: relative; border-radius: 26px; overflow: hidden; color: #fff; background: var(--marca-2); box-shadow: 0 2px 4px rgba(18,58,94,.12), 0 18px 40px rgba(18,58,94,.22); }
  .tarjeta .arriba { padding: 22px 22px 18px; background: linear-gradient(160deg, var(--marca) 0%, var(--marca-2) 100%); }
  .tarjeta .fila-t { display: flex; justify-content: space-between; align-items: flex-start; }
  .tarjeta .lbl { font-size: 13px; opacity: .75; }
  .tarjeta .nom { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .tarjeta .cuenta { text-align: right; }
  .tarjeta .cuenta b { font-family: "Gloock", serif; font-weight: 400; font-size: 34px; line-height: 1; }
  .tarjeta .cuenta span { font-size: 15px; opacity: .8; }
  .sellos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 4px 22px 22px; background: var(--marca-2); }
  .sellos.m8 { grid-template-columns: repeat(4, 1fr); }
  .sello { aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255,255,255,.35); display: grid; place-items: center; font-size: 12px; color: rgba(255,255,255,.6); transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
  .sello.lleno { border: 0; background: #fff; color: var(--marca-2); }
  .sello.lleno svg { width: 46%; height: 46%; }
  .sello.nuevo { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  .sello.premio { border-style: solid; border-color: rgba(255,255,255,.7); font-weight: 600; color: #fff; text-align: center; line-height: 1.1; padding: 6px; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .pie-t { display: flex; justify-content: space-between; padding: 14px 22px; background: rgba(0,0,0,.18); font-size: 13px; }

  .bloque { background: var(--blanco); border-radius: var(--radio); padding: 20px; margin-top: 16px; box-shadow: var(--sombra); }
  .bloque h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .premio-listo { background: var(--fondo-marca); border: 1.5px solid var(--marca); }
  .premio-listo h2 { color: var(--marca-2); }
  .premio-listo .btn { margin-top: 14px; }
  .faltan { font-size: 15px; color: var(--tinta-2); margin-top: 14px; text-align: center; }
  .faltan b { color: var(--tinta); }

  .hist li { list-style: none; display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--linea); font-size: 15px; }
  .hist li:first-child { border-top: 0; }
  .hist li span:last-child { color: var(--tinta-2); }

  .canje { position: fixed; inset: 0; background: rgba(17,24,33,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .hoja { background: var(--blanco); width: 100%; max-width: 460px; border-radius: 26px 26px 0 0; padding: 26px 22px calc(26px + env(safe-area-inset-bottom)); text-align: center; animation: sube .35s ease; }
  @keyframes sube { from { transform: translateY(40px); opacity: 0; } }
  .hoja h3 { font-size: 20px; margin-bottom: 4px; }
  .hoja .qr { margin: 18px auto 10px; width: 220px; }
  .hoja .qr svg { width: 100%; height: auto; display: block; }
  .codigo { font-family: ui-monospace, Menlo, monospace; font-size: 30px; letter-spacing: .18em; font-weight: 700; margin-bottom: 6px; }
  .hecho { padding: 30px 0 10px; }
  .hecho .circ { width: 74px; height: 74px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; animation: pop .6s cubic-bezier(.3,1.6,.5,1); }

  .formu h2 { font-family: "Gloock", serif; font-weight: 400; font-size: 28px; line-height: 1.1; margin-bottom: 6px; }
  .formu > p { color: var(--tinta-2); margin-bottom: 20px; }
  .aviso-sello { background: var(--fondo-marca); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 18px; color: var(--marca-2); font-weight: 600; }
  .pin { letter-spacing: .5em; text-align: center; font-size: 22px; font-weight: 700; }
  .vipcard { position: relative; border-radius: 22px; padding: 20px 22px; margin-top: 16px; color: #F4EBDD; background: linear-gradient(155deg, #23262B 0%, #121315 100%); box-shadow: 0 14px 34px rgba(0,0,0,.25); overflow: hidden; }
  .vipcard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 1.5px solid rgba(214,182,128,.35); }
  .vipcard .lbl { font-size: 13px; color: #D6B680; }
  .vipcard h3 { font-family: "Gloock", serif; font-weight: 400; font-size: 26px; margin: 2px 0 2px; }
  .vipcard .vig { font-size: 14px; opacity: .8; }
  .vipcard ul, .club ul { list-style: none; margin: 14px 0 0; }
  .vipcard li, .club li { padding: 7px 0 7px 22px; position: relative; font-size: 15px; }
  .vipcard li::before, .club li::before { content: ""; position: absolute; left: 2px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #D6B680; }
  .vipcard .btn { background: #D6B680; color: #17181B; margin-top: 16px; }
  .club .precio { font-family: "Gloock", serif; font-size: 26px; margin-top: 12px; }
  .club .precio span { font-family: "Inst", sans-serif; font-size: 14px; color: var(--tinta-2); }
  .miqr { text-align: center; }
  .miqr .qr { width: 200px; margin: 14px auto 8px; } .miqr .qr svg { width: 100%; height: auto; display: block; }
  .kata { text-align: center; font-size: 12px; color: #9AA1AA; margin-top: 34px; }
</style>
</head>
<body>
<div class="app">
  <header class="cab oculto" id="cab"><div class="mono" id="mono"></div><div><h1 id="neg"></h1><p id="sub"></p></div></header>
  <main id="vista"><p class="cargando">Abriendo tu tarjeta…</p></main>
  <p class="kata">Tarjeta hecha por Kata Studio</p>
</div>

<script src="../vendor/supabase.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../comun.js"></script>
<script>
const slug = params.get('n') || 'jazmin';
const tokenQR = params.get('q');
const CLAVE = 'kata-tarjeta-' + slug;
let NEG = null, ESTADO = null, sondeo = null, qrTimer = null, vigia = null;
const MODO = () => (NEG && NEG.config.modo) || 'cliente';
const conBotones = () => MODO() !== 'recepcion';
const conMiQR = () => MODO() !== 'cliente';

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';

async function iniciar() {
  try {
    NEG = await rpc('negocio_info', { p_slug: slug });
    if (!NEG) { $('#vista').innerHTML = '<p class="cargando">No encontramos este negocio.</p>'; return; }
    aplicarMarca(NEG.config);
    document.title = 'Mi tarjeta · ' + NEG.nombre;
    $('#neg').textContent = NEG.nombre; $('#sub').textContent = NEG.config.subtitulo || '';
    $('#mono').textContent = NEG.nombre.trim()[0];
    $('#cab').classList.remove('oculto');
    const key = store.get(CLAVE);
    if (key) {
      ESTADO = await rpc('cliente_estado', { p_key: key });
      if (!ESTADO) { store.del(CLAVE); return registro(); }
      if (tokenQR) return sumar(key);
      return tarjeta();
    }
    registro();
  } catch (e) { $('#vista').innerHTML = `<p class="cargando">${esc(msg(e))}</p>`; }
}

function limpiarURL() { if (tokenQR) history.replaceState(null, '', location.pathname + '?n=' + encodeURIComponent(slug)); }

async function sumar(key) {
  try {
    const r = await rpc('sumar_sello', { p_key: key, p_token: tokenQR });
    ESTADO = r.estado; limpiarURL();
    tarjeta(true);
    if (r.premio_nuevo) toast('Completaste tu tarjeta. Tu premio está listo.', 'ok');
    else toast(r.sumados > 1 ? 'Hoy tu visita vale doble: +2 sellos' : 'Sello agregado. Gracias por volver.', 'ok');
    if (ESTADO.vip && ESTADO.vip.miembro) mostrarVipPago();
  } catch (e) { limpiarURL(); tarjeta(); toast(msg(e), e.code === 'hoy' ? '' : 'mal'); }
}

function tarjeta(animar = false) {
  const E = ESTADO, meta = E.meta;
  const llenos = E.premios_listos > 0 && E.sellos === 0 ? meta : E.sellos;
  let celdas = '';
  for (let i = 1; i <= meta; i++) {
    const lleno = i <= llenos;
    const nuevo = animar && i === llenos;
    if (lleno) celdas += `<div class="sello lleno${nuevo ? ' nuevo' : ''}">${CHECK}</div>`;
    else if (i === meta) celdas += `<div class="sello premio">Premio</div>`;
    else celdas += `<div class="sello">${i}</div>`;
  }
  const faltan = meta - E.sellos;
  let extra = '';
  const cb = conBotones();
  if (E.premios_listos > 0) extra += `<section class="bloque premio-listo"><h2>Tu premio está listo</h2><p>${esc(E.premio || 'Tu premio')}. ${cb ? 'Tócalo cuando estés en recepción.' : 'Te lo entregan en recepción cuando pagues.'}</p>${cb ? `<button class="btn ancho" onclick="pedir('premio')">Usar mi premio</button>` : ''}</section>`;
  if (E.cumple_regalo) extra += `<section class="bloque premio-listo"><h2>Feliz cumpleaños, ${esc(E.nombre.split(' ')[0])}</h2><p>${esc(E.cumple_regalo)}. Es tuyo durante todo este mes${cb ? '.' : '; pídelo en recepción.'}</p>${cb ? `<button class="btn ancho" onclick="pedir('cumple')">Usar mi regalo</button>` : ''}</section>`;
  const miqr = conMiQR() ? `<section class="bloque miqr"><h2>En recepción</h2><p class="nota">Al pagar, solo di tu número de WhatsApp y te suman la visita${E.vip ? ' y aplican tus beneficios' : ''}. Si prefieres, muéstrales este código.</p><div class="qr" id="miqr"><p class="nota">Cargando…</p></div><div class="codigo" id="micod"></div></section>` : '';
  const hist = E.visitas.length ? E.visitas.map((v) => `<li><span>${fechaCorta(v.fecha)}</span><span>${v.sellos > 1 ? '+2 sellos' : '+1 sello'}</span></li>`).join('') : '<li><span>Todavía no tienes visitas.</span><span></span></li>';
  $('#vista').innerHTML = `
    <section class="tarjeta">
      <div class="arriba"><div class="fila-t"><div><div class="lbl">Cliente</div><div class="nom">${esc(E.nombre)}</div></div>
      <div class="cuenta"><b>${llenos}</b><span> / ${meta}</span></div></div></div>
      <div class="sellos${meta > 6 ? ' m8' : ''}">${celdas}</div>
      <div class="pie-t"><span>Premio: ${esc(E.premio || '')}</span></div>
    </section>
    ${guardarHTML()}
    ${miqr}
    ${extra}
    ${vipHTML(E)}
    ${E.premios_listos > 0 ? '' : `<p class="faltan">${E.hoy_sellado ? 'Ya sumaste tu sello de hoy. ' : ''}Te ${faltan === 1 ? 'falta <b>1 visita</b>' : `faltan <b>${faltan} visitas</b>`} para tu premio.</p>`}
    <section class="bloque"><h2>Tus visitas</h2><ul class="hist">${hist}</ul></section>
    <section class="bloque"><h2>¿Cómo sumo un sello?</h2><p class="nota">${MODO() === 'recepcion' ? 'En cada visita, al pagar, di tu número de WhatsApp en recepción y te suman el sello.' : MODO() === 'ambos' ? 'En cada visita, escanea el QR de recepción o muéstrales tu código al pagar. Se suma uno por día.' : 'En cada visita, escanea con la cámara el QR que está en recepción. Se suma uno por día.'}</p></section>`;
  if (conMiQR()) { cargarQR(); vigilar(); }
}

function guardarHTML() {
  if (store.get('kata-guardada-' + slug)) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<section class="bloque" id="guardar" style="border:1.5px dashed var(--linea);box-shadow:none"><h2>Guarda tu tarjeta en el celular</h2>
    <p class="nota">${ios ? 'Toca el botón de compartir (el cuadrito con la flecha) y luego <b>Agregar a pantalla de inicio</b>.' : 'Toca los tres puntitos del navegador y luego <b>Agregar a pantalla principal</b>.'} Así la abres como una app, sin buscar el enlace.</p>
    <button class="enlace" onclick="store.set('kata-guardada-${slug}','1');$('#guardar').remove()">Ya la guardé</button></section>`;
}

async function cargarQR() {
  clearTimeout(qrTimer);
  try {
    const r = await rpc('cliente_qr', { p_key: store.get(CLAVE) });
    const box = $('#miqr'); if (!box) return;
    box.innerHTML = qrSVG(r.codigo, 220); $('#micod').textContent = r.codigo;
    const ms = Math.max(30000, new Date(r.expira) - Date.now() - 55000);
    qrTimer = setTimeout(cargarQR, ms);
  } catch (e) { const box = $('#miqr'); if (box) box.innerHTML = `<p class="nota">${esc(msg(e))}</p>`; qrTimer = setTimeout(cargarQR, 15000); }
}

function huella(E) { return [E.sellos, E.premios_listos, E.visitas.length, !!E.cumple_regalo, E.vip && E.vip.miembro, E.vip && E.vip.hasta].join('|'); }
function vigilar() {
  clearInterval(vigia);
  vigia = setInterval(async () => {
    if (document.hidden || $('#capa')) return;
    const e = await rpc('cliente_estado', { p_key: store.get(CLAVE) }).catch(() => null);
    if (!e || huella(e) === huella(ESTADO)) return;
    const antes = ESTADO; ESTADO = e;
    const nuevaVisita = e.visitas.length > antes.visitas.length || (e.visitas[0] && antes.visitas[0] && e.visitas[0].fecha !== antes.visitas[0].fecha);
    tarjeta(nuevaVisita);
    if (e.premios_listos > antes.premios_listos) toast('Completaste tu tarjeta. Tu premio está listo.', 'ok');
    else if (nuevaVisita) toast('Te sumaron la visita de hoy. Gracias por volver.', 'ok');
    else if (e.premios_listos < antes.premios_listos) toast('Premio entregado. Disfrútalo.', 'ok');
    else if (antes.cumple_regalo && !e.cumple_regalo) toast('Regalo de cumpleaños entregado.', 'ok');
    else if (e.vip && e.vip.miembro && !(antes.vip && antes.vip.miembro)) toast('Ya eres parte del ' + e.vip.nombre + '.', 'ok');
  }, 4000);
}

function mostrarVipPago() {
  const v = ESTADO.vip, capa = document.createElement('div'); capa.className = 'canje'; capa.id = 'capa';
  capa.innerHTML = `<div class="hoja"><section class="vipcard" style="text-align:left;margin:0"><div class="lbl">Miembro</div><h3>${esc(v.nombre)}</h3>
    <div class="vig">${esc(ESTADO.nombre)} · <span id="reloj"></span></div><ul>${(v.beneficios || []).map((b) => `<li>${esc(b)}</li>`).join('')}</ul></section>
    <p class="nota" style="margin-top:14px">Muestra esta pantalla en recepción al pagar para que apliquen tus beneficios.</p>
    <button class="btn claro ancho" style="margin-top:14px" onclick="cerrarCanje()">Listo</button></div>`;
  document.body.appendChild(capa);
  const tick = () => { const r = $('#reloj'); if (!r) return clearInterval(t); r.textContent = new Date().toLocaleTimeString('es-PA', { hour: 'numeric', minute: '2-digit', second: '2-digit' }); };
  const t = setInterval(tick, 1000); tick();
}

function vipHTML(E) {
  const v = E.vip; if (!v) return '';
  const ben = (v.beneficios || []).map((b) => `<li>${esc(b)}</li>`).join('');
  if (v.miembro) return `<section class="vipcard"><div class="lbl">Miembro</div><h3>${esc(v.nombre)}</h3>
    <div class="vig">${v.hasta ? 'Activa hasta el ' + fechaCorta(v.hasta) : 'Membresía activa'}</div><ul>${ben}</ul>
    ${conBotones() ? `<button class="btn ancho" onclick="pedir('vip')">Mostrar en recepción</button>` : '<p class="vig" style="margin-top:12px">Recepción ve tus beneficios cuando das tu número al pagar.</p>'}</section>`;
  const gratis = !(+v.cuota > 0);
  return `<section class="bloque club"><h2>${esc(v.nombre)}</h2><p class="nota">${v.vencida ? 'Tu membresía venció. Renuévala en recepción y sigue con tus beneficios.' : 'Beneficios para los clientes de siempre.'}</p><ul>${ben}</ul>
    ${gratis ? '<button class="btn ancho" style="margin-top:14px" onclick="unirse()">Unirme al club</button>' : `<div class="precio">${dinero(v.cuota)} <span>al ${esc(v.periodo || 'mes')}</span></div><p class="nota" style="margin-top:6px">Pídelo en recepción y lo activan en tu tarjeta.</p>`}</section>`;
}
async function unirse() {
  try { ESTADO = await rpc('vip_unirse', { p_key: store.get(CLAVE) }); tarjeta(); toast('Ya eres parte del club.', 'ok'); } catch (e) { toast(msg(e), 'mal'); }
}

async function pedir(tipo) {
  const key = store.get(CLAVE);
  try {
    const r = await rpc('canje_pedir', { p_key: key, p_tipo: tipo });
    mostrarCanje(r.codigo, tipo);
  } catch (e) { toast(msg(e), 'mal'); }
}

function mostrarCanje(codigo, tipo) {
  const capa = document.createElement('div'); capa.className = 'canje'; capa.id = 'capa';
  capa.innerHTML = `<div class="hoja"><h3>${{ cumple: 'Tu regalo de cumpleaños', vip: ESTADO.vip ? ESTADO.vip.nombre : 'Club', premio: 'Tu premio' }[tipo]}</h3>
    <p class="nota">Muestra esta pantalla en recepción.</p>
    <div class="qr">${qrSVG(codigo, 220)}</div><div class="codigo">${codigo}</div>
    <p class="nota">Si no lo pueden escanear, díctales el código.</p>
    <button class="btn claro ancho" style="margin-top:18px" onclick="cerrarCanje()">Cerrar</button></div>`;
  capa.addEventListener('click', (ev) => { if (ev.target === capa) cerrarCanje(); });
  document.body.appendChild(capa);
  if (tipo === 'vip') return;
  const antes = { p: ESTADO.premios_listos, c: !!ESTADO.cumple_regalo };
  clearInterval(sondeo);
  sondeo = setInterval(async () => {
    const e = await rpc('cliente_estado', { p_key: store.get(CLAVE) }).catch(() => null);
    if (!e) return;
    if ((tipo === 'premio' && e.premios_listos < antes.p) || (tipo === 'cumple' && antes.c && !e.cumple_regalo)) {
      clearInterval(sondeo); ESTADO = e;
      $('.hoja', capa).innerHTML = `<div class="hecho"><div class="circ">${CHECK.replace('<svg', '<svg width="38" height="38"')}</div><h3>¡Listo, disfrútalo!</h3><p class="nota">Recepción ya lo marcó como usado.</p></div><button class="btn ancho" onclick="cerrarCanje()">Volver a mi tarjeta</button>`;
    }
  }, 3000);
}
function cerrarCanje() { clearInterval(sondeo); const c = $('#capa'); if (c) c.remove(); tarjeta(); }

function registro() {
  const dias = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
  const meses = MESES.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  $('#vista').innerHTML = `<section class="formu">
    <h2>Tu tarjeta de cliente frecuente</h2>
    <p>Se crea una sola vez. En cada visita sumas un sello y al completar ${NEG.config.meta || 6} recibes: ${esc(NEG.config.premio || 'un premio')}.</p>
    ${tokenQR ? '<div class="aviso-sello">Al crear tu tarjeta se suma el sello de hoy.</div>' : ''}
    <form id="f" novalidate>
      <div class="campo"><label for="nom">Tu nombre</label><input id="nom" autocomplete="name" required></div>
      <div class="campo"><label for="tel">Tu WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" placeholder="6000-0000" required></div>
      <div class="campo"><label>Tu cumpleaños (opcional)</label><div class="fila"><select id="dia"><option value="">Día</option>${dias}</select><select id="mes"><option value="">Mes</option>${meses}</select></div></div>
      <div class="campo"><label for="pin">Crea un código de 4 números</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" required><p class="nota" style="margin-top:6px">Te sirve para recuperar tu tarjeta si cambias de celular.</p></div>
      <label class="check"><input type="checkbox" id="ok"> Acepto que ${esc(NEG.nombre)} guarde mi nombre, WhatsApp y cumpleaños para esta tarjeta y para escribirme sobre mis visitas.</label>
      <p class="error" id="err"></p>
      <button class="btn ancho" id="go">Crear mi tarjeta</button>
    </form>
    <p style="text-align:center;margin-top:16px"><button class="enlace" onclick="recuperar()">Ya tengo tarjeta</button></p></section>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    if (!$('#ok').checked) { $('#err').textContent = 'Necesitamos tu permiso para crear la tarjeta.'; return; }
    $('#go').disabled = true; $('#err').textContent = '';
    try {
      const d = $('#dia').value, m = $('#mes').value;
      const r = await rpc('cliente_registrar', { p_slug: slug, p_nombre: $('#nom').value, p_tel: $('#tel').value, p_pin: $('#pin').value, p_dia: d && m ? +d : null, p_mes: d && m ? +m : null });
      store.set(CLAVE, r.device_key); ESTADO = r.estado;
      if (tokenQR) return sumar(r.device_key);
      tarjeta(); toast('Tu tarjeta está lista.', 'ok');
    } catch (e) { $('#err').textContent = msg(e); $('#go').disabled = false; }
  };
}

function recuperar() {
  $('#vista').innerHTML = `<section class="formu"><h2>Entra a tu tarjeta</h2><p>Con el WhatsApp y el código de 4 números que usaste al crearla.</p>
    <form id="f" novalidate>
      <div class="campo"><label for="tel">Tu WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" required></div>
      <div class="campo"><label for="pin">Tu código</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" required></div>
      <p class="error" id="err"></p><button class="btn ancho" id="go">Entrar</button></form>
    <p class="nota" style="text-align:center;margin-top:16px">¿Olvidaste tu código? Pídele a recepción que te ayude.</p>
    <p style="text-align:center"><button class="enlace" onclick="registro()">Crear una tarjeta nueva</button></p></section>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true; $('#err').textContent = '';
    try {
      const r = await rpc('cliente_recuperar', { p_slug: slug, p_tel: $('#tel').value, p_pin: $('#pin').value });
      store.set(CLAVE, r.device_key); ESTADO = r.estado;
      if (tokenQR) return sumar(r.device_key);
      tarjeta(); toast('Qué bueno verte de nuevo.', 'ok');
    } catch (e) { $('#err').textContent = msg(e); $('#go').disabled = false; }
  };
}

iniciar();
</script>
