      <div class="qr">${qrSVG(r.codigo, 210)}</div><div class="codigo">${r.codigo}</div></div>${btnCerrar('Cerrar')}`);
    if (tipo === 'vip') return;
    const antes = { p: ESTADO.premios_listos, d: ESTADO.detalles_listos, c: !!ESTADO.cumple_regalo };
    sondeo = setInterval(async () => {
      const e = await rpc('cliente_estado', { p_key: store.get(CLAVE) }).catch(() => null);
      if (e && ((tipo === 'premio' && e.premios_listos < antes.p) || (tipo === 'detalle' && e.detalles_listos < antes.d) || (tipo === 'cumple' && antes.c && !e.cumple_regalo))) {
        clearInterval(sondeo); ESTADO = e;
        $('#hc', v).innerHTML = `<div class="hecho"><div class="circ">${I.check.replace('<svg', '<svg width="36" height="36"')}</div><h3>Listo, disfrútalo</h3><p class="nota">Recepción ya lo marcó como usado.</p></div>`;
      }
    }, 3000);
  } catch (e) { toast(msg(e), 'mal'); }
}

/* ---------- Bienvenida, registro y recuperación ---------- */
function bienvenida() {
  const c = NEG.config, meta = c.meta || 6;
  let celdas = '';
  for (let i = 1; i <= meta; i++) celdas += i === meta ? `<div class="s meta">${I.regalo}</div>` : i === c.detalle_en && i > 2 ? `<div class="s det">50%</div>` : `<div class="s${i <= 2 ? ' on' : ''}">${i <= 2 ? I.check : ''}</div>`;
  $('#vista').innerHTML = `<div style="height:26px"></div>
    <div class="wallet uno" style="pointer-events:none"><div class="pase"><div class="giro"><div class="cara sellos-f">
      <div class="f-top"><div><small>Tarjeta de cliente</small><b>Tu nombre</b></div><div class="cuenta">2<span> / ${meta}</span></div></div>
      <div class="grid${meta > 6 ? (meta > 8 ? ' m10' : ' m8') : ''}">${celdas}</div>
      <div class="f-pie"><span>${esc(c.premio || '')}</span></div></div></div></div></div>
    <div class="cuerpo bienv">
      <h2>Tu tarjeta de cliente frecuente</h2>
      <p>Cada compra suma un sello. Al completar ${meta} recibes: <b>${esc(c.premio || 'un premio')}</b>.${c.detalle_en ? ` En la visita ${c.detalle_en}: <b>${esc(c.detalle || '')}</b>.` : ''}${(c.dias_dobles || []).includes('3') ? ' Los miércoles tu visita vale doble.' : ''}</p>
      <button class="btn ancho" onclick="registro()">Crear mi tarjeta</button>
      <button class="btn claro ancho" style="margin-top:10px" onclick="recuperar()">Ya tengo tarjeta</button>
    </div>`;
}

function registro() {
  const dias = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
  const meses = MESES.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  $('#vista').innerHTML = `<div style="height:22px"></div><section class="formu">
    <h2>Crea tu tarjeta</h2>
    <p>Solo se hace una vez.</p>
    ${tokenQR ? '<div class="aviso-sello">Al crear tu tarjeta se suma el sello de hoy.</div>' : ''}
    <form id="f" novalidate>
      <div class="campo"><label for="nom">Tu nombre</label><input id="nom" autocomplete="name" required></div>
      <div class="campo"><label for="tel">Tu WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" placeholder="6000-0000" required></div>
      <div class="campo"><label>Tu cumpleaños (opcional)</label><div class="fila"><select id="dia"><option value="">Día</option>${dias}</select><select id="mes"><option value="">Mes</option>${meses}</select></div></div>
      <div class="campo"><label for="pin">Crea un código de 4 números</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" required><p class="nota" style="margin-top:6px">Te sirve para entrar a tu tarjeta desde otro celular.</p></div>
      <label class="check"><input type="checkbox" id="ok"> Acepto que ${esc(NEG.nombre)} guarde mi nombre, WhatsApp y cumpleaños para esta tarjeta y para escribirme sobre mis visitas.</label>
      <p class="error" id="err"></p>
      <button class="btn ancho" id="go">Crear mi tarjeta</button>
    </form>
    <p style="text-align:center;margin-top:14px"><button class="enlace" onclick="bienvenida()">Volver</button></p></section>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    if (!$('#ok').checked) { $('#err').textContent = 'Necesitamos tu permiso para crear la tarjeta.'; return; }
    $('#go').disabled = true; $('#err').textContent = '';
    try {
      const d = $('#dia').value, m = $('#mes').value;
      const r = await rpc('cliente_registrar', { p_slug: slug, p_nombre: $('#nom').value, p_tel: $('#tel').value, p_pin: $('#pin').value, p_dia: d && m ? +d : null, p_mes: d && m ? +m : null });
      store.set(CLAVE, r.device_key); ESTADO = await rpc('cliente_estado', { p_key: r.device_key });
      if (tokenQR) return sumar(r.device_key);
      pintar(); celebrar('Tu tarjeta está lista.');
    } catch (e) { $('#err').textContent = msg(e); $('#go').disabled = false; }
  };
}

function recuperar() {
  $('#vista').innerHTML = `<div style="height:22px"></div><section class="formu"><h2>Entra a tu tarjeta</h2><p>Con el WhatsApp y el código de 4 números que usaste al crearla.</p>
    <form id="f" novalidate>
      <div class="campo"><label for="tel">Tu WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" required></div>
      <div class="campo"><label for="pin">Tu código</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" required></div>
      <p class="error" id="err"></p><button class="btn ancho" id="go">Entrar</button></form>
    <p class="nota" style="text-align:center;margin-top:14px">¿Olvidaste tu código? Pídele a recepción que te ayude.</p>
    <p style="text-align:center"><button class="enlace" onclick="bienvenida()">Volver</button></p></section>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true; $('#err').textContent = '';
    try {
      const r = await rpc('cliente_recuperar', { p_slug: slug, p_tel: $('#tel').value, p_pin: $('#pin').value });
      store.set(CLAVE, r.device_key); ESTADO = await rpc('cliente_estado', { p_key: r.device_key });
      if (tokenQR) return sumar(r.device_key);
      pintar(); celebrar('Qué bueno verte de nuevo.');
    } catch (e) { $('#err').textContent = msg(e); $('#go').disabled = false; }
  };
}

iniciar();
</script>
</body>
</html>
