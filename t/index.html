<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123A5E">
<title>Mi tarjeta</title>
<script>
  (function () {
    var n = (new URLSearchParams(location.search).get('n') || 'jazmin').replace(/[^a-z0-9-]/g, '');
    var h = document.head;
    function l(rel, href) { var e = document.createElement('link'); e.rel = rel; e.href = href; h.appendChild(e); }
    l('apple-touch-icon', '../iconos/' + n + '-180.png');
    l('icon', '../iconos/' + n + '-192.png');
    l('manifest', '../iconos/' + n + '.webmanifest');
  })();
</script>
<meta name="apple-mobile-web-app-title" content="Mi tarjeta">
<link rel="stylesheet" href="../comun.css">
<style>
  body { background: var(--fondo); overflow-x: hidden; }
  .cielo { position: absolute; inset: 0 0 auto 0; height: 300px; background: radial-gradient(120% 90% at 85% 0%, color-mix(in srgb, var(--marca) 85%, #fff 15%) 0%, var(--marca-2) 70%); border-radius: 0 0 36px 36px; z-index: 0; }
  .app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 0 60px; }
  .cab { display: flex; align-items: center; gap: 12px; padding: 0 20px; color: #fff; }
  .mono { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); display: grid; place-items: center; font-family: "Gloock", serif; font-size: 22px; flex: none; }
  .cab h1 { font-family: "Gloock", serif; font-weight: 400; font-size: 21px; line-height: 1.1; }
  .cab p { font-size: 12px; opacity: .75; }
  .ico { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .ico svg { width: 22px; height: 22px; }
  .hola { padding: 18px 20px 14px; color: #fff; font-size: 15px; opacity: .92; }
  .hola b { font-weight: 600; }

  .wallet { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 20px 18px; scrollbar-width: none; }
  .wallet::-webkit-scrollbar { display: none; }
  .pase { flex: 0 0 calc(100% - 36px); scroll-snap-align: center; perspective: 1400px; }
  .wallet.uno .pase { flex-basis: 100%; }
  .giro { position: relative; height: 236px; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.8,.2,1); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .giro:active { scale: .985; }
  .pase.vuelta .giro { transform: rotateY(180deg); }
  .cara { position: absolute; inset: 0; border-radius: 24px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; box-shadow: 0 2px 4px rgba(10,20,40,.10), 0 22px 40px rgba(10,20,40,.22); }
  .cara.atras { transform: rotateY(180deg); background: #fff; color: var(--tinta); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; }
  .atras .qr { width: 168px; flex: none; }
  .giro.fija { cursor: default; } .giro.fija:active { scale: 1; }
  .voltear svg { width: 16px !important; height: 16px !important; } .voltear:has(svg:only-child) { padding: 8px; } .atras .qr svg { width: 100%; height: auto; display: block; }
  .atras h3 { font-size: 16px; margin-bottom: 6px; } .atras p { font-size: 13px; color: var(--tinta-2); line-height: 1.4; }
  .atras .cod { font-family: ui-monospace, Menlo, monospace; font-size: 15px; letter-spacing: .2em; font-weight: 600; color: var(--tinta-2); }
  .atras .num { display: block; margin: 2px 0 8px; font-weight: 700; font-size: 17px; color: var(--tinta); }
  .atras .mini { font-size: 11px; color: #9AA1AA; margin-top: 10px; display: flex; align-items: center; gap: 5px; }
  .atras .mini svg { width: 12px; height: 12px; }

  .sellos-f { background: linear-gradient(150deg, var(--marca) 0%, var(--marca-2) 78%); color: #fff; padding: 18px 20px; display: flex; flex-direction: column; }
  .sellos-f::after { content: ""; position: absolute; right: -60px; bottom: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events: none; }
  .f-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .f-top small { font-size: 12px; opacity: .8; display: block; }
  .f-top b { font-size: 18px; font-weight: 600; }
  .cuenta { font-family: "Gloock", serif; font-size: 34px; line-height: 1; text-align: right; }
  .cuenta span { font-family: "Inst", sans-serif; font-size: 14px; opacity: .75; }
  .grid { margin-top: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .grid.m8 { grid-template-columns: repeat(8, 1fr); } .grid.m10 { grid-template-columns: repeat(5, 1fr); }
  .s { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.45); display: grid; place-items: center; }
  .s.on { border: 0; background: #fff; color: var(--marca-2); box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .s.on svg { width: 52%; height: 52%; }
  .s.meta { border-style: solid; border-color: rgba(255,255,255,.85); }
  .s.meta svg { width: 50%; height: 50%; color: #fff; opacity: .9; }
  .s.nuevo { animation: pop .7s cubic-bezier(.3,1.7,.5,1); }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }
  .f-pie { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .f-pie > span:first-child { opacity: .85; }
  .voltear { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.18); padding: 6px 11px; border-radius: 999px; font-weight: 600; }
  .voltear svg { width: 14px; height: 14px; }

  .vip-f { background: linear-gradient(155deg, #2A2C31 0%, #111214 100%); color: #F4EBDD; padding: 18px 20px; display: flex; flex-direction: column; }
  .vip-f::after { content: ""; position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 50%; border: 1.5px solid rgba(214,182,128,.35); box-shadow: 0 0 0 26px rgba(214,182,128,.05); pointer-events: none; }
  .vip-f small { color: #D6B680; font-size: 12px; }
  .vip-f h3 { font-family: "Gloock", serif; font-weight: 400; font-size: 28px; line-height: 1.05; margin-top: 2px; }
  .vip-f .vig { font-size: 13px; opacity: .75; margin-top: 4px; }
  .vip-f .ben { margin-top: auto; font-size: 13px; line-height: 1.55; }
  .vip-f .ben span { display: block; } .vip-f .ben span::before { content: "·"; color: #D6B680; font-weight: 700; margin-right: 8px; }
  .vip-f .voltear { background: rgba(214,182,128,.18); color: #F4EBDD; }

  .puntos-n { display: flex; justify-content: center; gap: 6px; margin-top: -4px; }
  .puntos-n i { width: 7px; height: 7px; border-radius: 4px; background: #C9CDD3; transition: all .3s; }
  .puntos-n i.on { width: 20px; background: var(--marca-2); }

  .cuerpo { padding: 14px 20px 0; }
  .progreso { background: #fff; border-radius: 20px; padding: 16px 18px; box-shadow: var(--sombra); }
  .progreso p { font-size: 15px; } .progreso p b { font-weight: 700; }
  .barra { height: 8px; background: #ECE8E1; border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--marca), var(--marca-2)); border-radius: 4px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

  .avisos { display: grid; gap: 10px; margin-top: 12px; }
  .aviso { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 20px; padding: 14px 16px; box-shadow: var(--sombra); border: 0; width: 100%; text-align: left; cursor: pointer; position: relative; overflow: hidden; font: inherit; color: inherit; }
  .aviso::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--marca); }
  .aviso .ic { width: 42px; height: 42px; border-radius: 14px; background: var(--fondo-marca); color: var(--marca-2); display: grid; place-items: center; flex: none; }
  .aviso .ic svg { width: 22px; height: 22px; }
  .aviso b { display: block; font-size: 15px; } .aviso span span { font-size: 13px; color: var(--tinta-2); }
  .aviso .fl { margin-left: auto; color: var(--tinta-2); display: grid; }
  .aviso.brilla .ic { animation: latido 2.4s ease-in-out infinite; }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .acciones-r { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .acc { background: #fff; border: 0; border-radius: 20px; padding: 14px 6px 12px; box-shadow: var(--sombra); display: flex; flex-direction: column; align-items: center; gap: 8px; font: inherit; font-size: 13px; font-weight: 600; color: var(--tinta); cursor: pointer; transition: transform .15s; }
  .acc:active { transform: scale(.95); }
  .acc .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--fondo-marca); color: var(--marca-2); display: grid; place-items: center; }
  .acc .ic svg { width: 21px; height: 21px; }
  .acc.dorado .ic { background: #23262B; color: #D6B680; }

  .velo { position: fixed; inset: 0; background: rgba(12,18,28,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .25s; }
  .velo.ver { opacity: 1; }
  .hoja { background: #fff; width: 100%; max-width: 460px; border-radius: 28px 28px 0 0; padding: 12px 22px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); max-height: 86vh; overflow-y: auto; }
  .velo.ver .hoja { transform: none; }
  .asa { width: 40px; height: 5px; border-radius: 3px; background: #DDD8D0; margin: 0 auto 16px; }
  .hoja h3 { font-size: 21px; margin-bottom: 6px; }
  .hoja .qr { width: 210px; margin: 16px auto 8px; } .hoja .qr svg { width: 100%; height: auto; display: block; }
  .hoja .codigo { font-family: ui-monospace, Menlo, monospace; font-size: 28px; letter-spacing: .18em; font-weight: 700; text-align: center; }
  .hist { padding: 0; } .hist li { list-style: none; display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--linea); font-size: 15px; }
  .hist li:first-child { border-top: 0; } .hist li span:last-child { color: var(--tinta-2); }
  .lista-b { padding: 0; } .lista-b li { list-style: none; padding: 9px 0 9px 26px; position: relative; font-size: 15px; }
  .lista-b li::before { content: ""; position: absolute; left: 4px; top: 16px; width: 9px; height: 9px; border-radius: 50%; background: #D6B680; }
  .pasos { padding: 0; } .pasos li { list-style: none; display: flex; gap: 12px; padding: 10px 0; font-size: 15px; align-items: flex-start; }
  .pasos li i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--fondo-marca); color: var(--marca-2); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .precio { font-family: "Gloock", serif; font-size: 30px; margin-top: 10px; }
  .precio span { font-family: "Inst", sans-serif; font-size: 14px; color: var(--tinta-2); }
  .hecho { text-align: center; padding: 20px 0 6px; }
  .hecho .circ { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 12px; animation: pop .6s cubic-bezier(.3,1.6,.5,1); }

  .formu { background: #fff; border-radius: 26px; padding: 24px 20px; margin: 0 16px; box-shadow: 0 2px 4px rgba(10,20,40,.08), 0 22px 40px rgba(10,20,40,.16); }
  .formu h2 { font-family: "Gloock", serif; font-weight: 400; font-size: 27px; line-height: 1.1; margin-bottom: 6px; }
  .formu > p { color: var(--tinta-2); margin-bottom: 18px; font-size: 15px; }
  .aviso-sello { background: var(--fondo-marca); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; color: var(--marca-2); font-weight: 600; }
  .pin { letter-spacing: .5em; text-align: center; font-size: 22px; font-weight: 700; }
  .bienv { padding-top: 22px; }
  .bienv h2 { font-family: "Gloock", serif; font-weight: 400; font-size: 28px; line-height: 1.1; margin-bottom: 8px; }
  .bienv p { color: var(--tinta-2); font-size: 16px; margin-bottom: 22px; } .bienv p b { color: var(--tinta); }
  .kata a { color: inherit; text-decoration: none; border-bottom: 1px solid #D5D9DE; }
  .kata { text-align: center; font-size: 12px; color: #9AA1AA; margin-top: 30px; }
</style>
</head>
<body>
<div class="cielo"></div>
<div class="app">
  <header class="cab oculto" id="cab"><div class="mono" id="mono"></div><div><h1 id="neg"></h1><p id="sub"></p></div></header>
  <main id="vista"><p class="cargando" style="color:#fff">Abriendo tu tarjeta…</p></main>
  <p class="kata">Tarjeta hecha por Kata Studio · <a href="https://www.instagram.com/holakata.pa/" target="_blank" rel="noopener">@holakata.pa</a></p>
</div>

<script src="../vendor/supabase.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../comun.js"></script>
<script>
const slug = params.get('n') || 'jazmin';
const tokenQR = params.get('q');
const CLAVE = 'kata-tarjeta-' + slug;
if (params.get('k')) store.set(CLAVE, params.get('k'));
let NEG = null, ESTADO = null, sondeo = null, qrTimer = null, vigia = null;
const MODO = () => (NEG && NEG.config.modo) || 'cliente';
const recep = () => MODO() !== 'cliente';

const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
  regalo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3-5-3.5-5-1.3C7 8 9.5 8 12 8zm0 0c1.5-3 5-3.5 5-1.3C17 8 14.5 8 12 8z"/></svg>',
  pastel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 20v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6M5 16c2 1 3-1 4.5 0s2.5 1 3.5 0 2.5-1 3.5 0 2.5 0 2.5 0M12 12V8M12 5.5c.8-.9.8-1.7 0-2.5-.8.8-.8 1.6 0 2.5z"/></svg>',
  reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  corona: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16M5 15l-1.5-8 5 4L12 5l3.5 6 5-4L19 15z"/></svg>',
  cel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M12 8v6M9 11.5l3 3 3-3"/></svg>',
  giro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="14.5" width="6" height="6" rx="1"/><path d="M14.5 14.5h2v2M20.5 14.5v6h-6v-3"/></svg>',
  fl: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};

async function iniciar() {
  try {
    NEG = await rpc('negocio_info', { p_slug: slug });
    if (!NEG) { $('#vista').innerHTML = '<p class="cargando" style="color:#fff">No encontramos este negocio.</p>'; return; }
    aplicarMarca(NEG.config);
    document.title = 'Mi tarjeta · ' + NEG.nombre;
    $('#neg').textContent = NEG.nombre; $('#sub').textContent = NEG.config.subtitulo || '';
    $('#mono').textContent = NEG.nombre.trim()[0];
    $('#cab').classList.remove('oculto');
    if (params.get('k')) history.replaceState(null, '', location.pathname + '?n=' + encodeURIComponent(slug));
    const key = store.get(CLAVE);
    if (key) {
      ESTADO = await rpc('cliente_estado', { p_key: key });
      if (!ESTADO) { store.del(CLAVE); return bienvenida(); }
      if (tokenQR) return sumar(key);
      return pintar();
    }
    bienvenida();
  } catch (e) { $('#vista').innerHTML = `<p class="cargando" style="color:#fff">${esc(msg(e))}</p>`; }
}

function limpiarURL() { if (tokenQR) history.replaceState(null, '', location.pathname + '?n=' + encodeURIComponent(slug)); }

async function sumar(key) {
  try {
    const r = await rpc('sumar_sello', { p_key: key, p_token: tokenQR });
    ESTADO = r.estado; limpiarURL(); pintar(true);
    celebrar(r.premio_nuevo ? 'Completaste tu tarjeta. Tu premio está listo.' : r.sumados > 1 ? 'Hoy tu visita vale doble: +2 sellos' : 'Sello agregado. Gracias por volver.');
  } catch (e) { limpiarURL(); pintar(); toast(msg(e), e.code === 'hoy' ? '' : 'mal'); }
}

function celebrar(t) { toast(t, 'ok'); try { navigator.vibrate && navigator.vibrate([18, 40, 18]); } catch (e) {} }

/* ---------- Pantalla principal ---------- */
function pintar(animar = false) {
  const E = ESTADO, meta = E.meta, V = E.vip;
  const llenos = E.premios_listos > 0 && E.sellos === 0 ? meta : E.sellos;
  const faltan = meta - E.sellos;
  let celdas = '';
  for (let i = 1; i <= meta; i++) {
    if (i <= llenos) celdas += `<div class="s on${animar && i === llenos ? ' nuevo' : ''}">${I.check}</div>`;
    else if (i === meta) celdas += `<div class="s meta">${I.regalo}</div>`;
    else celdas += `<div class="s"></div>`;
  }
  const vipActivo = !!(V && V.miembro), giraSellos = recep() && !vipActivo, giraVip = vipActivo;
  const atras = `<div class="cara atras"><div class="qr" data-qr></div><div class="cod" data-cod>······</div></div>`;
  const pSellos = `<div class="pase" id="p0"><div class="giro${giraSellos ? '' : ' fija'}" onclick="voltear(this)">
      <div class="cara sellos-f"><div class="f-top"><div><small>Tarjeta de cliente</small><b>${esc(E.nombre)}</b></div><div class="cuenta">${llenos}<span> / ${meta}</span></div></div>
        <div class="grid${meta > 6 ? (meta > 8 ? ' m10' : ' m8') : ''}">${celdas}</div>
        <div class="f-pie"><span>${esc(E.premio || '')}</span>${giraSellos ? `<span class="voltear">${I.qr}</span>` : ''}</div></div>
      ${giraSellos ? atras : ''}</div></div>`;
  const pVip = V && V.miembro ? `<div class="pase" id="p1"><div class="giro" onclick="voltear(this)">
      <div class="cara vip-f"><small>Miembro</small><h3>${esc(V.nombre)}</h3><div class="vig">${V.hasta ? 'Activa hasta el ' + fechaCorta(V.hasta) : 'Membresía activa'}</div>
        <div class="ben">${(V.beneficios || []).slice(0, 3).map((b) => `<span>${esc(b)}</span>`).join('')}</div>
        <div class="f-pie" style="justify-content:flex-end"><span class="voltear">${I.qr}</span></div></div>
      ${recep() ? atras : ''}</div></div>` : '';

  const avisos = [];
  if (E.premios_listos > 0) avisos.push(`<button class="aviso brilla" onclick="hojaPremio('premio')"><span class="ic">${I.regalo}</span><span><b>Tu premio está listo</b><span>${esc(E.premio || '')}</span></span><span class="fl">${I.fl}</span></button>`);
  if (E.cumple_regalo) avisos.push(`<button class="aviso brilla" onclick="hojaPremio('cumple')"><span class="ic">${I.pastel}</span><span><b>Feliz cumpleaños, ${esc(E.nombre.split(' ')[0])}</b><span>${esc(E.cumple_regalo)}</span></span><span class="fl">${I.fl}</span></button>`);

  const pct = Math.round((llenos / meta) * 100);
  const frase = E.premios_listos > 0 ? `Completaste tu tarjeta. <b>${esc(E.premio || 'Tu premio')}</b> te espera.`
    : `${E.hoy_sellado ? 'Visita de hoy sumada. ' : ''}Te ${faltan === 1 ? 'falta <b>1 visita</b>' : `faltan <b>${faltan} visitas</b>`} para tu ${esc((E.premio || 'premio').toLowerCase())}.`;

  $('#vista').innerHTML = `
    <p class="hola">Hola, <b>${esc(E.nombre.split(' ')[0])}</b></p>
    <div class="wallet${pVip ? '' : ' uno'}" id="wallet">${pSellos}${pVip}</div>
    ${pVip ? '<div class="puntos-n" id="pn"><i class="on"></i><i></i></div>' : ''}
    <div class="cuerpo">
      <div class="progreso"><p>${frase}</p><div class="barra"><i id="bar"></i></div></div>
      ${avisos.length ? `<div class="avisos">${avisos.join('')}</div>` : ''}
      <div class="acciones-r"${V ? '' : ' style="grid-template-columns:repeat(2,1fr)"'}>
        <button class="acc" onclick="hojaVisitas()"><span class="ic">${I.reloj}</span>Mis visitas</button>
        ${V ? `<button class="acc dorado" onclick="hojaClub()"><span class="ic">${I.corona}</span>${V.miembro ? 'Beneficios' : 'Club'}</button>` : ''}
        <button class="acc" onclick="hojaGuardar()"><span class="ic">${I.cel}</span>Guardar</button>
      </div>
    </div>`;
  requestAnimationFrame(() => setTimeout(() => { const b = $('#bar'); if (b) b.style.width = pct + '%'; }, 120));
  const w = $('#wallet');
  if (w && pVip) w.onscroll = () => { const i = w.scrollLeft > (w.scrollWidth - w.clientWidth) / 2 ? 1 : 0; $$('#pn i').forEach((d, k) => d.classList.toggle('on', k === i)); };
  if (recep()) { cargarQR(); vigilar(); }
  if (!store.get('kata-vio-guardar-' + slug)) { store.set('kata-vio-guardar-' + slug, '1'); setTimeout(hojaGuardar, 1500); }
}

function voltear(el) {
  if (el.classList.contains('fija')) return;
  if (!recep()) { if (el.closest('#p1')) pedir('vip'); return; }
  el.parentElement.classList.toggle('vuelta');
  try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
}

async function cargarQR() {
  clearTimeout(qrTimer);
  try {
    const r = await rpc('cliente_qr', { p_key: store.get(CLAVE) });
    $$('[data-qr]').forEach((b) => (b.innerHTML = qrSVG(r.codigo, 200)));
    $$('[data-cod]').forEach((b) => (b.textContent = r.codigo));
    qrTimer = setTimeout(cargarQR, Math.max(30000, new Date(r.expira) - Date.now() - 55000));
  } catch (e) { qrTimer = setTimeout(cargarQR, 15000); }
}

function huella(E) { return [E.sellos, E.premios_listos, E.visitas.length, E.visitas[0] && E.visitas[0].fecha, !!E.cumple_regalo, E.vip && E.vip.miembro, E.vip && E.vip.hasta].join('|'); }
function vigilar() {
  clearInterval(vigia);
  vigia = setInterval(async () => {
    if (document.hidden || $('.velo')) return;
    const e = await rpc('cliente_estado', { p_key: store.get(CLAVE) }).catch(() => null);
    if (!e || huella(e) === huella(ESTADO)) return;
    const antes = ESTADO; ESTADO = e;
    const nueva = (e.visitas[0] && e.visitas[0].fecha) !== (antes.visitas[0] && antes.visitas[0].fecha);
    pintar(nueva);
    if (e.premios_listos > antes.premios_listos) celebrar('Completaste tu tarjeta. Tu premio está listo.');
    else if (nueva) celebrar('Te sumaron la visita de hoy. Gracias por volver.');
    else if (e.premios_listos < antes.premios_listos) celebrar('Premio entregado. Disfrútalo.');
    else if (antes.cumple_regalo && !e.cumple_regalo) celebrar('Regalo de cumpleaños entregado.');
    else if (e.vip && e.vip.miembro && !(antes.vip && antes.vip.miembro)) celebrar('Ya eres parte del ' + e.vip.nombre + '.');
  }, 4000);
}

/* ---------- Hojas ---------- */
function hoja(html) {
  cerrarHoja(true);
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="hoja"><div class="asa"></div>${html}</div>`;
  v.addEventListener('click', (ev) => { if (ev.target === v) cerrarHoja(); });
  document.body.appendChild(v); requestAnimationFrame(() => v.classList.add('ver'));
  return v;
}
function cerrarHoja(ya) { clearInterval(sondeo); const v = $('.velo'); if (!v) return; if (ya) return v.remove(); v.classList.remove('ver'); setTimeout(() => v.remove(), 280); }
const btnCerrar = (t = 'Listo') => `<button class="btn claro ancho" style="margin-top:18px" onclick="cerrarHoja()">${t}</button>`;

function hojaVisitas() {
  const E = ESTADO;
  hoja(`<h3>Tus visitas</h3><p class="nota">${E.visitas.length ? 'Las últimas veces que viniste.' : 'Aquí verás cada visita que sumes.'}</p>
    <ul class="hist" style="margin-top:10px">${E.visitas.length ? E.visitas.map((v) => `<li><span>${fechaCorta(v.fecha)}</span><span>${v.sellos > 1 ? '+2 sellos' : '+1 sello'}</span></li>`).join('') : ''}</ul>${btnCerrar()}`);
}
function hojaClub() {
  const V = ESTADO.vip, ben = `<ul class="lista-b" style="margin-top:10px">${(V.beneficios || []).map((b) => `<li>${esc(b)}</li>`).join('')}</ul>`;
  if (V.miembro) return hoja(`<h3>${esc(V.nombre)}</h3><p class="nota">${V.hasta ? 'Tu membresía está activa hasta el ' + fechaCorta(V.hasta) + '.' : 'Tu membresía está activa.'}</p>${ben}
    <p class="nota" style="margin-top:12px">${recep() ? 'Al pagar, di tu número en recepción y aplican tus beneficios.' : 'Muestra tu tarjeta del club en recepción.'}</p>${btnCerrar()}`);
  const gratis = !(+V.cuota > 0);
  hoja(`<h3>${esc(V.nombre)}</h3><p class="nota">${V.vencida ? 'Tu membresía venció. Renuévala en recepción y sigue con tus beneficios.' : 'Beneficios para los clientes de siempre.'}</p>${ben}
    ${gratis ? '<button class="btn ancho" style="margin-top:16px" onclick="unirse()">Unirme al club</button>' : `<div class="precio">${dinero(V.cuota)} <span>al ${esc(V.periodo || 'mes')}</span></div><p class="nota" style="margin-top:6px">Pídelo en recepción y lo activan en tu tarjeta al momento.</p>`}${btnCerrar('Cerrar')}`);
}
function hojaPremio(tipo) {
  const E = ESTADO, t = tipo === 'cumple' ? 'Tu regalo de cumpleaños' : 'Tu premio';
  const d = tipo === 'cumple' ? E.cumple_regalo + '. Es tuyo durante todo este mes.' : (E.premio || '') + '.';
  if (!recep()) return pedir(tipo);
  hoja(`<h3>${t}</h3><p class="nota">${esc(d)}</p><ul class="pasos" style="margin-top:12px"><li><i>1</i>Pídelo en recepción cuando vengas.</li><li><i>2</i>Di tu número de WhatsApp.</li><li><i>3</i>Te lo entregan y aquí se marca solo.</li></ul>${btnCerrar()}`);
}
function hojaGuardar() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  hoja(`<h3>Guarda tu tarjeta en el celular</h3><p class="nota">Así la abres con un toque, como una app.</p>
    <ul class="pasos" style="margin-top:12px">${ios ? '<li><i>1</i><span>Toca el botón de compartir de Safari (el cuadrito con la flecha hacia arriba).</span></li><li><i>2</i><span>Toca <b>Agregar a pantalla de inicio</b>.</span></li><li><i>3</i><span>Toca <b>Agregar</b>.</span></li>'
      : '<li><i>1</i><span>Toca los tres puntitos de arriba a la derecha.</span></li><li><i>2</i><span>Toca <b>Agregar a la pantalla principal</b>.</span></li><li><i>3</i><span>Confirma con <b>Agregar</b>.</span></li>'}</ul>
    <p class="nota" style="margin-top:8px">Si no la guardas, no pasa nada: en recepción te encuentran con tu número.</p>${btnCerrar('Entendido')}`);
}
async function unirse() {
  try { ESTADO = await rpc('vip_unirse', { p_key: store.get(CLAVE) }); cerrarHoja(true); pintar(); celebrar('Ya eres parte del club.'); } catch (e) { toast(msg(e), 'mal'); }
}

/* Canje con código (negocios donde el cliente se atiende solo) */
async function pedir(tipo) {
  try {
    const r = await rpc('canje_pedir', { p_key: store.get(CLAVE), p_tipo: tipo });
    const t = { cumple: 'Tu regalo de cumpleaños', vip: ESTADO.vip ? ESTADO.vip.nombre : 'Club', premio: 'Tu premio' }[tipo];
    const v = hoja(`<div id="hc"><h3 style="text-align:center">${esc(t)}</h3><p class="nota" style="text-align:center">Muestra esta pantalla en recepción.</p>
      <div class="qr">${qrSVG(r.codigo, 210)}</div><div class="codigo">${r.codigo}</div></div>${btnCerrar('Cerrar')}`);
    if (tipo === 'vip') return;
    const antes = { p: ESTADO.premios_listos, c: !!ESTADO.cumple_regalo };
    sondeo = setInterval(async () => {
      const e = await rpc('cliente_estado', { p_key: store.get(CLAVE) }).catch(() => null);
      if (e && ((tipo === 'premio' && e.premios_listos < antes.p) || (tipo === 'cumple' && antes.c && !e.cumple_regalo))) {
        clearInterval(sondeo); ESTADO = e;
        $('#hc', v).innerHTML = `<div class="hecho"><div class="circ">${I.check.replace('<svg', '<svg width="36" height="36"')}</div><h3>Listo, disfrútalo</h3><p class="nota">Recepción ya lo marcó como usado.</p></div>`;
      }
    }, 3000);
  } catch (e) { toast(msg(e), 'mal'); }
}

/* ---------- Bienvenida, registro y recuperación ---------- */
function bienvenida() {
  const c = NEG.config, meta = c.meta || 6;
  let celdas = '';
  for (let i = 1; i <= meta; i++) celdas += i === meta ? `<div class="s meta">${I.regalo}</div>` : `<div class="s${i <= 2 ? ' on' : ''}">${i <= 2 ? I.check : ''}</div>`;
  $('#vista').innerHTML = `<div style="height:26px"></div>
    <div class="wallet uno" style="pointer-events:none"><div class="pase"><div class="giro"><div class="cara sellos-f">
      <div class="f-top"><div><small>Tarjeta de cliente</small><b>Tu nombre</b></div><div class="cuenta">2<span> / ${meta}</span></div></div>
      <div class="grid${meta > 6 ? (meta > 8 ? ' m10' : ' m8') : ''}">${celdas}</div>
      <div class="f-pie"><span>${esc(c.premio || '')}</span></div></div></div></div></div>
    <div class="cuerpo bienv">
      <h2>Tu tarjeta de cliente frecuente</h2>
      <p>Cada visita suma un sello. Al completar ${meta} recibes: <b>${esc(c.premio || 'un premio')}</b>.</p>
      <button class="btn ancho" onclick="registro()">Crear mi tarjeta</button>
      <button class="btn claro ancho" style="margin-top:10px" onclick="recuperar()">Ya tengo tarjeta</button>
    </div>`;
}

function registro() {
  const dias = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
  const meses = MESES.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  $('#vista').innerHTML = `<div style="height:22px"></div><section class="formu">
    <h2>Crea tu tarjeta</h2>
    <p>Solo se hace una vez.</p>
    ${tokenQR ? '<div class="aviso-sello">Al crear tu tarjeta se suma el sello de hoy.</div>' : ''}
    <form id="f" novalidate>
      <div class="campo"><label for="nom">Tu nombre</label><input id="nom" autocomplete="name" required></div>
      <div class="campo"><label for="tel">Tu WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" placeholder="6000-0000" required></div>
      <div class="campo"><label>Tu cumpleaños (opcional)</label><div class="fila"><select id="dia"><option value="">Día</option>${dias}</select><select id="mes"><option value="">Mes</option>${meses}</select></div></div>
      <div class="campo"><label for="pin">Crea un código de 4 números</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" required><p class="nota" style="margin-top:6px">Te sirve para entrar a tu tarjeta desde otro celular.</p></div>
      <label class="check"><input type="checkbox" id="ok"> Acepto que ${esc(NEG.nombre)} guarde mi nombre, WhatsApp y cumpleaños para esta tarjeta y para escribirme sobre mis visitas.</label>
      <p class="error" id="err"></p>
      <button class="btn ancho" id="go">Crear mi tarjeta</button>
    </form>
    <p style="text-align:center;margin-top:14px"><button class="enlace" onclick="bienvenida()">Volver</button></p></section>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    if (!$('#ok').checked) { $('#err').textContent = 'Necesitamos tu permiso para crear la tarjeta.'; return; }
    $('#go').disabled = true; $('#err').textContent = '';
    try {
      const d = $('#dia').value, m = $('#mes').value;
      const r = await rpc('cliente_registrar', { p_slug: slug, p_nombre: $('#nom').value, p_tel: $('#tel').value, p_pin: $('#pin').value, p_dia: d && m ? +d : null, p_mes: d && m ? +m : null });
      store.set(CLAVE, r.device_key); ESTADO = await rpc('cliente_estado', { p_key: r.device_key });
      if (tokenQR) return sumar(r.device_key);
      pintar(); celebrar('Tu tarjeta está lista.');
    } catch (e) { $('#err').textContent = msg(e); $('#go').disabled = false; }
  };
}

function recuperar() {
  $('#vista').innerHTML = `<div style="height:22px"></div><section class="formu"><h2>Entra a tu tarjeta</h2><p>Con el WhatsApp y el código de 4 números que usaste al crearla.</p>
    <form id="f" novalidate>
      <div class="campo"><label for="tel">Tu WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" required></div>
      <div class="campo"><label for="pin">Tu código</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" required></div>
      <p class="error" id="err"></p><button class="btn ancho" id="go">Entrar</button></form>
    <p class="nota" style="text-align:center;margin-top:14px">¿Olvidaste tu código? Pídele a recepción que te ayude.</p>
    <p style="text-align:center"><button class="enlace" onclick="bienvenida()">Volver</button></p></section>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true; $('#err').textContent = '';
    try {
      const r = await rpc('cliente_recuperar', { p_slug: slug, p_tel: $('#tel').value, p_pin: $('#pin').value });
      store.set(CLAVE, r.device_key); ESTADO = await rpc('cliente_estado', { p_key: r.device_key });
      if (tokenQR) return sumar(r.device_key);
      pintar(); celebrar('Qué bueno verte de nuevo.');
    } catch (e) { $('#err').textContent = msg(e); $('#go').disabled = false; }
  };
}

iniciar();
</script>
</body>
</html>
