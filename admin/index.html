<!doctype html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">

<title>Administradora · Kata Studio</title>
<link rel="stylesheet" href="../comun.css">
<style>
  body { background: var(--fondo); }
  .login { max-width: 400px; margin: 0 auto; padding: 60px 20px; }
  .kmark { width: 34px; height: 34px; position: relative; margin-bottom: 20px; }
  .kmark i { position: absolute; width: 12px; height: 12px; border: 3px solid #0D1B36; border-radius: 4px; }
  .kmark i:nth-child(1) { top: 0; left: 0; } .kmark i:nth-child(2) { top: 0; right: 0; } .kmark i:nth-child(3) { bottom: 0; left: 0; }
  .kmark b { position: absolute; right: -1px; bottom: -1px; width: 15px; height: 15px; background: #FF6B57; border-radius: 50%; }
  h1 { font-family: "Plus Jakarta Sans", "Inst", sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -.8px; line-height: 1.1; color: #0D1B36; margin-bottom: 8px; }
  .login > p { color: var(--tinta-2); margin-bottom: 22px; }
  .login .btn, .cont .btn.coral { background: #FF6B57; }
  .qr { display: block; margin: 0 auto 12px; width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 8px; }
  .sec { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); margin: 26px 0 10px; }
  .top { background: #0D1B36; color: #fff; }
  .top-in { max-width: 900px; margin: 0 auto; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
  .top-in h2 { font-size: 17px; font-weight: 700; flex: 1; } .top-in p { font-size: 13px; opacity: .7; }
  .top .salir { background: none; border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .cont { max-width: 900px; margin: 0 auto; padding: 8px 18px 70px; }
  .aviso { background: #FFF1E6; border: 1px solid #F4B860; border-radius: 16px; padding: 14px 16px; margin-top: 18px; font-size: 15px; }
  .aviso b { display: block; margin-bottom: 2px; }
  .cli { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--linea); border-radius: 18px; padding: 14px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--sombra); }
  .logo { width: 46px; height: 46px; border-radius: 13px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; background: #0D1B36; overflow: hidden; }
  .logo.img { background: #fff; border: 1px solid var(--linea); padding: 4px; } .logo img { width: 100%; height: 100%; object-fit: contain; }
  .cli .inf { flex: 1; min-width: 0; } .cli b { display: block; font-size: 16px; } .cli span { font-size: 14px; color: var(--tinta-2); }
  .chip { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #EFEAE2; color: #55606E; white-space: nowrap; }
  .chip.ok { background: #DDF1E7; color: #1E6B49; } .chip.pronto { background: #FFE9C7; color: #8A5A00; } .chip.venc { background: #FBDCD5; color: #A33A22; } .chip.mens { background: #E4ECFB; color: #2A4F9A; } .chip.uni { background: #EDE6FF; color: #5A42BD; }
  .col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .caja { background: #fff; border: 1px solid var(--linea); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--sombra); }
  .caja h3 { font-size: 17px; margin-bottom: 10px; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 520px) { .dos { grid-template-columns: 1fr; } }
  .caja input, .caja select, .caja textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--linea); border-radius: 12px; background: #fff; }
  .caja textarea { min-height: 70px; } .caja .campo { margin-bottom: 12px; }
  .fila-s { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--linea); } .fila-s:first-of-type { border-top: 0; }
  .fila-s .inf { flex: 1; min-width: 0; font-size: 15px; } .fila-s .inf span { display: block; font-size: 13px; color: var(--tinta-2); overflow-wrap: anywhere; }
  .fila-s select { width: auto; min-height: 38px; } .mini { min-height: 38px; padding: 0 14px; font-size: 14px; }
  .atras { background: none; border: 0; font-weight: 700; color: #0D1B36; padding: 14px 0 4px; cursor: pointer; font-size: 15px; }
  .num { display: flex; gap: 10px; margin-bottom: 4px; } .num div { flex: 1; background: #F6F4F0; border-radius: 12px; padding: 10px; text-align: center; } .num b { display: block; font-size: 22px; } .perm { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 15px; font-weight: 500; color: var(--tinta); margin: 0; } .perm input { width: 22px; min-height: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: #FF6B57; } .sub-c { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--linea); }  .num span { font-size: 12.5px; color: var(--tinta-2); }
</style>

<body>
<div id="app"><p class="cargando" style="padding:40px;text-align:center">Cargando…</p></div>
<script src="../vendor/supabase.js"></script>
<script src="xlsx.js"></script>
<script>
const sb = window.supabase.createClient('https://pxviwzkfljcvmrwrselw.supabase.co', 'sb_publishable_l-V4Nhz_lHpEafNLNwCPqQ_XTGVlzaL', { auth: { persistSession: true, storageKey: 'kata-panel' } });
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fecha = (iso) => { if (!iso) return ''; const d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const hoy = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); };
const dias = (iso) => Math.round((new Date(String(iso).slice(0, 10) + 'T12:00:00') - hoy()) / 864e5);
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const dinero = (n) => 'B/. ' + Number(n || 0).toFixed(2).replace(/\.00$/, '');
const iso10 = (d) => d.toISOString().slice(0, 10);
function toast(t) { let e = $('#toast'); if (!e) { e = document.createElement('div'); e.id = 'toast'; document.body.appendChild(e); } e.className = 'toast'; e.textContent = t; requestAnimationFrame(() => e.classList.add('ver')); clearTimeout(e._h); e._h = setTimeout(() => e.classList.remove('ver'), 3800); }
async function rpc(fn, args = {}) { const { data, error } = await sb.rpc(fn, args); if (error) { const e = new Error(error.message); throw e; } return data; }
const app = (h) => { $('#app').innerHTML = h; };
const cabecera = (sub = '') => `<header class="top"><div class="top-in"><div><h2>Kata Studio · Administradora</h2><p>${esc(sub)}</p></div><button class="salir" onclick="salir()">Salir</button></div></header>`;
async function salir() { await sb.auth.signOut(); location.href = 'https://holakata.com/'; }

/* ---------- acceso: correo + contraseña + código del autenticador ---------- */
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return login();
  paso2();
}
function login(error = '') {
  app(`<div class="login"><div class="kmark"><i></i><i></i><i></i><b></b></div><h1>Panel de administradora</h1><p>Solo para Kata Studio.</p>
    <form id="f" novalidate><div class="campo"><label for="em">Correo</label><input id="em" type="email" autocomplete="username"></div>
    <div class="campo"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
    <p class="error" id="err">${esc(error)}</p><button class="btn ancho" id="go">Entrar</button></form></div>`);
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true; $('#err').textContent = '';
    const { error: e } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (e) { $('#err').textContent = 'El correo o la contraseña no coinciden.'; $('#go').disabled = false; return; }
    paso2();
  };
}
async function paso2() {
  const { data: a } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (a && a.currentLevel === 'aal2') return principal();
  const { data: f } = await sb.auth.mfa.listFactors();
  const t = (f && f.totp || [])[0];
  if (t) return pedirCodigo(t.id);
  for (const u of (f && f.all || [])) await sb.auth.mfa.unenroll({ factorId: u.id });
  inscribir();
}
function pedirCodigo(factorId, error = '') {
  app(`<div class="login"><div class="kmark"><i></i><i></i><i></i><b></b></div><h1>Código de seguridad</h1><p>Abre tu app autenticadora y escribe el código de 6 números de Kata Studio.</p>
    <form id="f" novalidate><div class="campo"><label for="cd">Código</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
    <p class="error" id="err">${esc(error)}</p><button class="btn ancho" id="go">Confirmar</button></form><p style="margin-top:18px"><button class="enlace" onclick="salir()">Salir</button></p></div>`);
  $('#cd').focus();
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code: $('#cd').value.trim() });
    if (error) return pedirCodigo(factorId, 'Ese código no es correcto. Prueba con el siguiente.');
    principal();
  };
}
async function inscribir(error = '') {
  const { data, error: e } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Kata ' + Date.now() });
  if (e) { await sb.auth.signOut(); return login('No se pudo activar la verificación. Intenta de nuevo.'); }
  app(`<div class="login"><div class="kmark"><i></i><i></i><i></i><b></b></div><h1>Activa tu código de seguridad</h1><p>Primera vez: escanea este QR con Google Authenticator, Authy o Microsoft Authenticator. Luego escribe el código que te muestre.</p>
    <img class="qr" alt="QR" src="${esc(data.totp.qr_code)}"><p class="nota" style="text-align:center;margin-bottom:14px;overflow-wrap:anywhere">¿No puedes escanear? Escribe esta clave: <b>${esc(data.totp.secret)}</b></p>
    <form id="f" novalidate><div class="campo"><label for="cd">Código de 6 números</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
    <p class="error" id="err">${esc(error)}</p><button class="btn ancho" id="go">Activar y entrar</button></form></div>`);
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true;
    const { error: v } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code: $('#cd').value.trim() });
    if (v) { $('#err').textContent = 'Ese código no es correcto. Prueba con el siguiente.'; $('#go').disabled = false; return; }
    principal();
  };
}

/* ---------- lista de clientes ---------- */
let LISTA = [];
const PERMISOS = [
  ['canjear', 'Escanear al cliente y canjear premios y regalos'],
  ['qr', 'Ver el QR del mostrador'],
  ['regalos_crear', 'Crear tarjetas de regalo'],
  ['regalos_anular', 'Anular tarjetas de regalo'],
  ['ver_todo', 'Ver teléfonos y códigos completos de los regalos y los cumpleaños de todo el año'],
  ['club_activar', 'Activar o renovar membresías del club'],
  ['club_quitar', 'Quitar membresías del club'],
  ['clientes_editar', 'Corregir los datos de un cliente'],
  ['clientes_borrar', 'Borrar clientes'],
  ['promos', 'Cambiar las promociones del club'],
  ['programa', 'Cambiar la regla de sellos, el premio y la vigencia (no el diseño de la tarjeta)'],
  ['resumen', 'Ver el resumen y la actividad del negocio'],
  ['sin_limites', 'Sin límites (regalos de más de $200 o membresías de más de 3 meses)'],
];
const permisosHTML = (pre, v = {}) => `<div>${PERMISOS.map(([k, t]) => `<label class="perm"><input type="checkbox" data-p="${pre}" value="${k}"${v[k] ? ' checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>
  <p class="sub-c" style="margin-top:6px"><button type="button" class="enlace" data-todos="${pre}:1">Marcar todos</button> · <button type="button" class="enlace" data-todos="${pre}:0">Quitar todos</button></p>`;
const leerPermisos = (pre, raiz = document) => { const o = {}; PERMISOS.forEach(([k]) => (o[k] = false)); raiz.querySelectorAll(`[data-p="${pre}"]`).forEach((c) => (o[c.value] = c.checked)); return o; };
function cablearTodos(raiz = document) { raiz.querySelectorAll('[data-todos]').forEach((b) => (b.onclick = () => { const [pre, v] = b.dataset.todos.split(':'); raiz.querySelectorAll(`[data-p="${pre}"]`).forEach((c) => (c.checked = v === '1')); })); }
const efectivos = (s) => { if (s.permisos) return s.permisos; const o = {}; PERMISOS.forEach(([k]) => (o[k] = s.rol === 'dueno' || ['canjear', 'qr', 'regalos_crear', 'club_activar'].includes(k))); return o; };

async function principal() {
  try { LISTA = await rpc('admin_lista'); }
  catch (e) { await sb.auth.signOut(); return login('Esta cuenta no tiene acceso al panel de administradora.'); }
  lista();
}
function lista() {
  const L = [...LISTA].sort((a, b) => (a.tipo === b.tipo ? 0 : a.tipo === 'mensualidad' ? -1 : 1) || a.nombre.localeCompare(b.nombre));
  const card = (n) => `<button class="cli" data-id="${esc(n.id)}"><div class="logo${n.logo ? ' img' : ''}" ${!n.logo && n.color ? `style="background:${esc(n.color)}"` : ''}>${n.logo ? `<img src="../${esc(n.logo)}" alt="">` : esc(n.nombre.trim()[0] || '?')}</div>
    <div class="inf"><b>${esc(n.nombre)}</b><span>${n.clientes} clientes · ${plural(n.cuentas, 'cuenta', 'cuentas')}</span>${n.notas ? `<span style="display:block;margin-top:2px">${esc(n.notas.length > 70 ? n.notas.slice(0, 70) + '…' : n.notas)}</span>` : ''}</div>
    <div class="col"><span class="chip ${n.tipo === 'mensualidad' ? 'mens' : 'uni'}">${n.tipo === 'mensualidad' ? 'Mensualidad' : 'Pago único'}</span></div></button>`;
  const mens = L.filter((n) => n.tipo === 'mensualidad'), uni = L.filter((n) => n.tipo !== 'mensualidad');
  app(`${cabecera('Tus clientes')}<main class="cont">
    <div class="sec">Mensualidades</div>${mens.map(card).join('') || '<p class="nota">Todavía no hay clientes con mensualidad.</p>'}
    <div class="sec">Pago único</div>${uni.map(card).join('') || '<p class="nota">Todavía no hay clientes con pago único.</p>'}
    <div class="sec">Copias de seguridad mensuales</div><div class="caja" id="copias"><p class="cargando">Cargando…</p></div></main>`);
  document.querySelectorAll('.cli').forEach((b) => (b.onclick = () => detalle(b.dataset.id)));
  copias();
}

/* ---------- Excel ---------- */
const NOMBRES = { clientes: 'Clientes', visitas: 'Visitas', canjes: 'Canjes', regalos: 'Regalos', membresias: 'Membresías', actividad: 'Actividad', negocios: 'Negocios', staff: 'Cuentas' };
function hojasDe(datos, conNegocio) {
  const quien = {}; (datos.clientes || []).forEach((c) => (quien[c.id] = c.nombre));
  const neg = {}; (datos.negocios || []).forEach((n) => (neg[n.id] = n.nombre));
  return ['clientes', 'visitas', 'canjes', 'regalos', 'membresias', 'actividad', 'negocios', 'staff'].filter((k) => datos[k]).map((k) => {
    const filas = (datos[k] || []).map((o) => { const x = { ...o }; if ('cliente_id' in x) x.cliente = quien[x.cliente_id] || ''; if (conNegocio && 'negocio_id' in x) x.negocio = neg[x.negocio_id] || ''; return x; });
    return { nombre: NOMBRES[k] || k, filas: XLSX.deObjetos(filas) };
  });
}
const hoyTxt = () => iso10(new Date(Date.now() - 5 * 36e5));
async function copiaNegocio(id) {
  const n = LISTA.find((x) => x.id === id);
  try { const d = await rpc('admin_copia_negocio', { p_negocio: id }); XLSX.descargar(XLSX.crear(hojasDe(d, false)), `kata-${n.slug}-${hoyTxt()}.xlsx`); toast('Copia descargada.'); }
  catch (e) { toast('No se pudo descargar. Vuelve a entrar.'); }
}
async function copias() {
  const el = $('#copias');
  try {
    const c = await rpc('admin_copias');
    el.innerHTML = c.length ? c.slice(0, 13).map((x) => `<div class="fila-s"><div class="inf"><b>${fecha(x.creado)}</b><span>Copia automática del día 1</span></div><button class="btn claro mini" data-c="${x.id}">Descargar Excel</button></div>`).join('') : '<p class="nota">Todavía no hay copias.</p>';
    el.querySelectorAll('[data-c]').forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try { const f = await rpc('admin_copia_ver', { p_id: Number(b.dataset.c) }); XLSX.descargar(XLSX.crear(hojasDe(f, true)), `kata-copia-${String(c.find((x) => String(x.id) === b.dataset.c).creado).slice(0, 10)}.xlsx`); toast('Copia descargada.'); }
      catch (e) { toast('No se pudo descargar.'); }
      b.disabled = false;
    }));
  } catch (e) { el.innerHTML = '<p class="error">No se pudieron cargar las copias.</p>'; }
}

/* ---------- cuentas (función segura en Supabase) ---------- */
const ERR = { existe: 'Ese correo ya tiene una cuenta.', clave: 'La contraseña debe tener al menos 8 caracteres.', correo: 'Revisa el correo.', nombre: 'Escribe el nombre.', permiso: 'Tu sesión terminó. Vuelve a entrar.' };
async function cuentas(cuerpo) {
  const { data } = await sb.auth.getSession();
  const r = await fetch('https://pxviwzkfljcvmrwrselw.supabase.co/functions/v1/admin-cuentas', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session ? data.session.access_token : ''), apikey: 'sb_publishable_l-V4Nhz_lHpEafNLNwCPqQ_XTGVlzaL' }, body: JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(ERR[j.error] || 'No se pudo. Intenta de nuevo.');
  return j;
}

/* ---------- detalle de un cliente ---------- */
async function detalle(id) {
  const n = LISTA.find((x) => x.id === id);
  app(`${cabecera(n.nombre)}<main class="cont"><button class="atras" onclick="lista()">← Todos los clientes</button>
    <div class="caja"><div class="num"><div><b>${n.clientes}</b><span>clientes</span></div><div><b>${n.cuentas}</b><span>cuentas</span></div><div><b>${n.ultima ? fecha(n.ultima) : '—'}</b><span>última actividad</span></div></div>
      <button class="btn coral ancho" id="ent" style="margin-top:14px">Entrar al panel de ${esc(n.nombre)}</button></div>
    <div class="caja"><h3>Arreglo con el cliente</h3><form id="fa" novalidate>
      <div class="campo"><label>Tipo</label><select id="tp"><option value="mensualidad">Mensualidad</option><option value="unico">Pago único</option></select></div>
      <div class="campo"><label>Arreglo de pago (monto, fechas, condiciones)</label><textarea id="nt"></textarea></div><button class="btn coral" id="sa">Guardar</button></form></div>
    <div class="caja"><h3>Cuentas de ${esc(n.nombre)}</h3><div id="eq"><p class="cargando">Cargando…</p></div></div>
    <div class="caja"><h3>Crear perfil</h3><form id="fc" novalidate autocomplete="off">
      <div class="dos"><div class="campo"><label>Nombre</label><input id="cn" autocomplete="off"></div><div class="campo"><label>Posición en la empresa</label><input id="cg" placeholder="Recepcionista, Dueña…" autocomplete="off"></div>
      <div class="campo"><label>Correo</label><input id="ce" type="email" autocomplete="off"></div><div class="campo"><label>Contraseña por mientras</label><input id="cc" autocomplete="off" placeholder="Mínimo 8 caracteres"></div></div>
      <label style="margin-top:4px">Qué puede hacer</label>${permisosHTML('nuevo')}
      <p class="error" id="ce2"></p><button class="btn coral" id="sc" style="margin-top:8px">Crear perfil</button></form>
      <p class="nota" style="margin-top:8px">La persona entra con su correo y esa contraseña, y después la cambia desde su panel.</p></div>
    <div class="caja"><h3>Datos y copia</h3><button class="btn claro ancho" id="cp">Descargar copia en Excel</button>
      <p class="nota" style="margin-top:8px">Clientes, visitas, canjes, regalos, membresías y actividad. Sin códigos ni claves.</p></div></main>`);
  $('#tp').value = n.tipo; $('#nt').value = n.notas || '';
  cablearTodos($('#fc'));
  $('#cp').onclick = () => copiaNegocio(id);
  $('#ent').onclick = async () => { try { await rpc('admin_entrar', { p_negocio: id }); location.href = '../panel/'; } catch (e) { toast('No se pudo entrar.'); } };
  $('#fa').onsubmit = async (ev) => { ev.preventDefault(); $('#sa').disabled = true;
    try { await rpc('admin_arreglo', { p_negocio: id, p_tipo: $('#tp').value, p_notas: $('#nt').value }); LISTA = await rpc('admin_lista'); toast('Guardado.'); } catch (x) { toast('No se pudo guardar.'); }
    $('#sa').disabled = false; };
  $('#fc').onsubmit = async (ev) => {
    ev.preventDefault(); $('#ce2').textContent = ''; $('#sc').disabled = true;
    try {
      await cuentas({ accion: 'crear', negocio_id: id, nombre: $('#cn').value, cargo: $('#cg').value, email: $('#ce').value, clave: $('#cc').value, permisos: leerPermisos('nuevo', $('#fc')) });
      LISTA = await rpc('admin_lista'); toast('Perfil creado.'); detalle(id);
    } catch (x) { $('#ce2').textContent = x.message; $('#sc').disabled = false; }
  };
  equipo(id);
}
async function equipo(id) {
  const el = $('#eq');
  try {
    const q = await rpc('admin_equipo', { p_negocio: id });
    el.innerHTML = q.map((s) => `<div class="cta" data-u="${esc(s.user_id)}"><div class="fila-s"><div class="inf"><b>${esc(s.nombre)}${s.cargo ? ' · ' + esc(s.cargo) : ''}</b><span>${esc(s.email)}</span></div>
        <button class="btn claro mini" data-a="perm">Permisos</button><button class="btn claro mini" data-a="clave">Contraseña</button><button class="btn claro mini" data-a="quitar">Quitar</button></div><div class="ed oculto"></div></div>`).join('') || '<p class="nota">Todavía no hay cuentas. Crea el primer perfil aquí abajo.</p>';
    el.querySelectorAll('.cta').forEach((c) => {
      const s = q.find((x) => x.user_id === c.dataset.u), ed = $('.ed', c);
      const abrir = (html) => { ed.innerHTML = html; ed.classList.remove('oculto'); ed.classList.add('sub-c'); cablearTodos(ed); };
      c.querySelectorAll('[data-a]').forEach((b) => (b.onclick = async () => {
        const a = b.dataset.a;
        if (a === 'perm') {
          if (!ed.classList.contains('oculto') && ed.dataset.m === 'perm') { ed.classList.add('oculto'); ed.dataset.m = ''; return; }
          abrir(`<div class="dos"><div class="campo"><label>Nombre</label><input data-n value="${esc(s.nombre)}"></div><div class="campo"><label>Posición</label><input data-g value="${esc(s.cargo || '')}"></div></div>${permisosHTML('u' + s.user_id.slice(0, 8), efectivos(s))}<button class="btn coral mini" data-s style="margin-top:8px">Guardar</button>`); ed.dataset.m = 'perm';
          $('[data-s]', ed).onclick = async () => { try { await rpc('admin_perfil', { p_user: s.user_id, p_nombre: $('[data-n]', ed).value, p_cargo: $('[data-g]', ed).value, p_permisos: leerPermisos('u' + s.user_id.slice(0, 8), ed) }); toast('Permisos guardados.'); equipo(id); } catch (x) { toast('No se pudo guardar.'); } };
        } else if (a === 'clave') {
          if (!ed.classList.contains('oculto') && ed.dataset.m === 'clave') { ed.classList.add('oculto'); ed.dataset.m = ''; return; }
          abrir(`<div class="campo"><label>Nueva contraseña por mientras</label><input data-c autocomplete="off" placeholder="Mínimo 8 caracteres"></div><button class="btn coral mini" data-s>Cambiar contraseña</button>`); ed.dataset.m = 'clave';
          $('[data-s]', ed).onclick = async () => { try { await cuentas({ accion: 'clave', user_id: s.user_id, clave: $('[data-c]', ed).value }); toast('Contraseña cambiada.'); ed.classList.add('oculto'); } catch (x) { toast(x.message); } };
        } else if (a === 'quitar') {
          if (!confirm(`¿Eliminar la cuenta de ${s.nombre}? Ya no podrá entrar al panel.`)) return;
          try { await cuentas({ accion: 'quitar', user_id: s.user_id }); LISTA = await rpc('admin_lista'); toast('Cuenta eliminada.'); detalle(id); } catch (x) { toast(x.message); }
        }
      }));
    });
  } catch (x) { el.innerHTML = '<p class="error">No se pudieron cargar las cuentas.</p>'; }
}
iniciar();
