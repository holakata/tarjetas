<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="kata-version" content="20261112192742">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<title>Acceso clientes · Kata Studio</title>
<link rel="stylesheet" href="../comun.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  /* La pantalla de entrada es de Kata Studio; al entrar, cada negocio ve su propia marca. */
  .login { max-width: 400px; margin: 0 auto; padding: 60px 20px; }
  .login .kmark { width: 34px; height: 34px; position: relative; margin-bottom: 20px; }
  .login .kmark i { position: absolute; width: 12px; height: 12px; border: 3px solid #0D1B36; border-radius: 4px; }
  .login .kmark i:nth-child(1) { top: 0; left: 0; } .login .kmark i:nth-child(2) { top: 0; right: 0; } .login .kmark i:nth-child(3) { bottom: 0; left: 0; }
  .login .kmark b { position: absolute; right: -1px; bottom: -1px; width: 15px; height: 15px; background: #FF6B57; border-radius: 50%; }
  .login h1 { font-family: "Plus Jakarta Sans", "Inst", sans-serif; font-weight: 800; font-size: 29px; letter-spacing: -.8px; line-height: 1.1; margin-bottom: 6px; color: #0D1B36; }
  .login > p { color: var(--tinta-2); margin-bottom: 26px; }
  .login .btn { background: #FF6B57; }

  .barra { position: sticky; top: 0; z-index: 10; background: rgba(246,244,240,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
  .barra-in { max-width: 1100px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; gap: 12px; }
  .mono.con-logo { background: #fff; border: 1px solid var(--linea); padding: 4px; } .mono img { width: 100%; height: 100%; object-fit: contain; }
  .mono { width: 40px; height: 40px; border-radius: 12px; background: var(--marca); color: #fff; display: grid; place-items: center; font-family: "Gloock", serif; font-size: 20px; flex: none; }
  .barra h1 { font-size: 16px; font-weight: 700; line-height: 1.1; }
  .barra p { font-size: 12px; color: var(--tinta-2); }
  .barra .salir { margin-left: auto; background: none; border: 0; color: var(--tinta-2); font-size: 14px; cursor: pointer; padding: 10px; }
  .tabs { max-width: 1100px; margin: 0 auto; padding: 0 12px; display: flex; gap: 4px; overflow-x: auto; }
  .tab { background: none; border: 0; padding: 12px 14px; font-weight: 600; font-size: 15px; color: var(--tinta-2); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; min-height: 48px; }
  .tab.on { color: var(--tinta); border-color: var(--marca); }
  .tab .c { display: none; }
  @media (max-width: 620px) { .tabs { gap: 0; padding: 0 4px; justify-content: space-between; } .tab { padding: 12px 8px; font-size: 14px; } .tab .l { display: none; } .tab .c { display: inline; } }
  .mini { font-size: 12px; font-weight: 700; color: var(--tinta-2); white-space: nowrap; }
  .chip.club { background: #23262B; color: #E3C27E; } .chip.bronze { background: #7A4D30; color: #FFF4EA; } .chip.platinum { background: #6E7680; color: #fff; } .chip.gold { background: #2A2215; color: #E3C27E; }
  .rg { flex-wrap: wrap; } .rg .rg-acc { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  @media (max-width: 620px) { .lista li.rg .info { flex: 1 0 100%; } .lista li.rg .rg-acc { margin-left: 0; } }

  .cont { max-width: 1100px; margin: 0 auto; padding: 22px 18px 80px; }
  .tarjeta { background: var(--blanco); border-radius: var(--radio); padding: 22px; box-shadow: var(--sombra); }
  h2.tit { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--tinta-2); margin-bottom: 18px; }

  /* Mostrador */
  .mostrador { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0; }
  .mostrador .qrbox { background: #fff; padding: 18px; border-radius: 28px; box-shadow: var(--sombra); width: min(78vw, 58vh, 460px); }
  .mostrador .qrbox svg { width: 100%; height: auto; display: block; }
  .mostrador h2 { font-family: "Gloock", serif; font-weight: 400; font-size: clamp(28px, 4.5vw, 44px); line-height: 1.1; margin: 0 0 6px; }
  .mostrador p { color: var(--tinta-2); margin-bottom: 20px; }
  .barrita { width: min(78vw, 58vh, 460px); height: 6px; background: var(--linea); border-radius: 3px; margin-top: 16px; overflow: hidden; }
  .barrita i { display: block; height: 100%; background: var(--marca); transition: width 1s linear; }
  .mostrador .seg { font-size: 13px; color: var(--tinta-2); margin-top: 8px; }
  body.full .barra { display: none; }
  .salir-m { margin-top: 34px; position: relative; overflow: hidden; border: 1px solid var(--linea); background: #fff; color: var(--tinta-2); font: inherit; font-size: 13px; padding: 10px 16px; border-radius: 999px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .salir-m i { position: absolute; inset: 0; width: 0; background: var(--fondo-marca); transition: width 0s; }
  .salir-m.carga i { width: 100%; transition: width 1.5s linear; }
  .salir-m span { position: relative; }
  body.full .cont { padding-top: 6vh; }

  /* Canjear */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  #lector { width: 100%; border-radius: 18px; overflow: hidden; background: #111; min-height: 260px; }
  #lector video { border-radius: 18px; }
  .codigo-in { font-family: ui-monospace, Menlo, monospace; letter-spacing: .25em; text-transform: uppercase; text-align: center; font-size: 22px; font-weight: 700; }
  .resultado { border: 2px solid var(--marca); }
  .resultado .tipo { display: inline-block; background: var(--fondo-marca); color: var(--marca-2); font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }
  .resultado h3 { font-size: 24px; margin-bottom: 4px; }
  .resultado .det { color: var(--tinta-2); margin-bottom: 16px; }
  .accion { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--linea); }
  .accion b { display: block; font-size: 16px; } .accion span { font-size: 13px; color: var(--tinta-2); }
  .accion .btn { min-height: 44px; padding: 0 16px; font-size: 15px; white-space: nowrap; flex: none; }
  .hecho-chip { font-size: 13px !important; font-weight: 700; color: var(--ok) !important; background: #E3F2EA; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  .exito { text-align: center; padding: 26px 10px; }
  .exito .circ { width: 70px; height: 70px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 12px; }

  /* Clientes */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--blanco); border-radius: 18px; padding: 16px; box-shadow: var(--sombra); }
  .stat b { font-family: "Gloock", serif; font-weight: 400; font-size: 34px; line-height: 1; display: block; }
  .stat span { font-size: 13px; color: var(--tinta-2); }
  .lista { list-style: none; }
  .lista li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--linea); }
  .lista li:first-child { border-top: 0; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--fondo-marca); color: var(--marca-2); display: grid; place-items: center; font-weight: 700; flex: none; }
  .lista .info { flex: 1; min-width: 0; }
  .lista .info b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lista .info span { font-size: 13px; color: var(--tinta-2); }
  .puntos { display: flex; gap: 3px; }
  .puntos i { width: 8px; height: 8px; border-radius: 50%; background: var(--linea); }
  .puntos i.on { background: var(--marca); }
  .chip { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--fondo-marca); color: var(--marca-2); white-space: nowrap; }
  .wa.redondo { width: 42px; min-height: 42px; padding: 0; border-radius: 50%; flex: none; } .wa.redondo svg { width: 22px; height: 22px; }
  .wa { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border-radius: 12px; background: #1F8F55; color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .seccion { margin-bottom: 18px; }
  .lista li.separador { display: block; padding: 18px 0 8px; font-size: 13px; font-weight: 700; color: #9A5B00; border-top: 2px solid #F3DDBA; }
  .lejos-chip { display: inline-block !important; margin-top: 4px; background: #FDF0DC; color: #9A5B00 !important; font-size: 12px !important; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .res-solo { max-width: 620px; margin: 0 auto; }
  .seccion h3 { font-size: 16px; margin-bottom: 4px; }
  .vacio { color: var(--tinta-2); font-size: 14px; padding: 8px 0; }

  /* Regalos */
  .tipos { display: flex; gap: 8px; margin-bottom: 16px; }
  .tipos label { flex: 1; margin: 0; }
  .tipos input { display: none; }
  .tipos span { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1.5px solid var(--linea); border-radius: 12px; font-weight: 600; color: var(--tinta); cursor: pointer; background: var(--blanco); }
  .tipos input:checked + span { border-color: var(--marca-2); background: var(--marca-2); color: #fff; }
  .creado { background: var(--fondo-marca); border-radius: 18px; padding: 18px; margin-top: 16px; }
  .creado .link { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; background: #fff; border-radius: 10px; padding: 10px; margin: 10px 0 12px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .estado { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .estado.activa { background: #E3F2EA; color: var(--ok); }
  .estado.usada { background: #EEE; color: #666; }
  .estado.pronto { background: #FDF0DC; color: #9A5B00; } .estado.vencida { background: #FBE7E5; color: #A23A2F; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtros button { border: 1px solid var(--linea); background: #fff; color: var(--tinta-2); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 999px; white-space: nowrap; cursor: pointer; min-height: 38px; }
  .filtros button.on { background: var(--marca-2); border-color: var(--marca-2); color: #fff; }
  .filtros button i { font-style: normal; opacity: .7; margin-left: 4px; }
  @media (max-width: 520px) { .stat b { font-size: 26px; } }
</style>
</head>
<body>
<div id="app"><p class="cargando">Cargando…</p></div>

<script src="../vendor/supabase.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../vendor/html5-qrcode.min.js"></script>
<script src="../comun.js"></script>
<script>
const BASE = location.href.replace(/panel\/.*$/, '');
let NEG = null, DATOS = null, pestaña = 'mostrador', tTimer = null, cTimer = null, lector = null;
const CHECK = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';

async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return login();
  try {
    NEG = await rpc('panel_negocio');
    if (!NEG) { await sb.auth.signOut(); return login('Esta cuenta no tiene un negocio asignado.'); }
    aplicarMarca(NEG.config); document.title = 'Recepción · ' + NEG.nombre;
    marco(); ir(store.get('kata-pestana') || (MODO() === 'recepcion' ? 'canjear' : 'mostrador'));
  } catch (e) { await sb.auth.signOut(); login(msg(e)); }
}

function login(error = '') {
  $('#app').innerHTML = `<div class="login"><div class="kmark"><i></i><i></i><i></i><b></b></div><h1>Hola, qué bueno verte.</h1><p>Este es el acceso para clientes de Kata Studio. Entra con el correo y la contraseña de tu negocio.</p>
    <form id="f" novalidate>
      <div class="campo"><label for="em">Correo</label><input id="em" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <p class="error" id="err">${esc(error)}</p><button class="btn ancho" id="go">Entrar</button></form></div>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault(); $('#go').disabled = true; $('#err').textContent = '';
    const { error: e } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (e) { $('#err').textContent = 'El correo o la contraseña no coinciden.'; $('#go').disabled = false; return; }
    iniciar();
  };
}

function marco() {
  $('#app').innerHTML = `<header class="barra"><div class="barra-in"><div class="mono${NEG.config.logo ? ' con-logo' : ''}">${NEG.config.logo ? `<img src="../${esc(NEG.config.logo)}" alt="">` : esc(NEG.nombre.trim()[0])}</div>
    <div><h1>${esc(NEG.nombre)}</h1><p>Panel de recepción</p></div><button class="salir" onclick="salir()">Salir</button></div>
    <nav class="tabs">
      ${MODO() === 'recepcion' ? '<button class="tab" data-t="canjear"><span class="l">Escanear cliente</span><span class="c">Escanear</span></button><button class="tab" data-t="mostrador"><span class="l">QR para crear tarjeta</span><span class="c">QR</span></button>'
        : `<button class="tab" data-t="mostrador"><span class="l">QR del mostrador</span><span class="c">QR</span></button><button class="tab" data-t="canjear">${MODO() === 'ambos' ? '<span class="l">Escanear cliente</span><span class="c">Escanear</span>' : 'Canjear'}</button>`}
      <button class="tab" data-t="clientes">Clientes</button>
      <button class="tab" data-t="regalos"><span class="l">Tarjetas de regalo</span><span class="c">Regalos</span></button>
      <button class="tab" data-t="vip">${esc((NEG.config.vip && NEG.config.vip.nombre) || 'Club')}</button>
    </nav></header><main class="cont" id="cont"></main>`;
  $$('.tab').forEach((b) => (b.onclick = () => ir(b.dataset.t)));
}

async function salir() { await detenerLector(); await sb.auth.signOut(); location.reload(); }

async function ir(t) {
  pestaña = t; store.set('kata-pestana', t);
  $$('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  clearTimeout(tTimer); clearInterval(cTimer); await detenerLector();
  document.body.classList.remove('full');
  ({ mostrador, canjear, clientes, regalos, vip })[t]();
}

const MODO = () => (NEG && NEG.config.modo) || 'cliente';

/* ---------- QR del mostrador ---------- */
function mostrador() {
  if (MODO() === 'recepcion') {
    $('#cont').innerHTML = `<div class="mostrador"><h2>¿Primera vez? Crea tu tarjeta</h2><p>Abre la cámara de tu celular y apunta aquí. Al pagar, muestra tu código en recepción.</p>
      <div class="qrbox">${qrSVG(`${BASE}t/?n=${encodeURIComponent(NEG.slug)}`, 420)}</div>
      ${SALIR_MOSTRADOR}</div>`;
    bloquearMostrador();
    return;
  }
  $('#cont').innerHTML = `<div class="mostrador"><h2>Escanea y suma tu visita</h2><p>Abre la cámara de tu celular y apunta aquí. Si es tu primera vez, se crea tu tarjeta.</p>
    <div class="qrbox" id="qr"></div><div class="barrita"><i id="bar"></i></div><div class="seg" id="seg">&nbsp;</div>
    ${SALIR_MOSTRADOR}</div>`;
  bloquearMostrador();
  refrescarQR();
}
async function refrescarQR() {
  if (pestaña !== 'mostrador') return;
  try {
    const r = await rpc('mostrador_token');
    $('#qr').innerHTML = qrSVG(`${BASE}t/?n=${encodeURIComponent(NEG.slug)}&q=${r.token}`, 420);
    let s = r.segundos;
    const pinta = () => { const b = $('#bar'); if (!b) return; b.style.width = (s / 30 * 100) + '%'; $('#seg').textContent = `El código cambia en ${s} s`; };
    pinta(); clearInterval(cTimer);
    cTimer = setInterval(() => { s = Math.max(0, s - 1); pinta(); }, 1000);
    tTimer = setTimeout(refrescarQR, r.segundos * 1000 + 400);
  } catch (e) { $('#seg').textContent = msg(e); tTimer = setTimeout(refrescarQR, 5000); }
}
/* Mientras el QR está a la vista de los clientes se ocultan las pestañas.
   Para volver al panel hay que mantener presionado el botón (un toque por accidente no basta). */
const SALIR_MOSTRADOR = '<button class="salir-m" id="salirM"><i></i><span>Mantén presionado para volver al panel</span></button>';
function bloquearMostrador() {
  document.body.classList.add('full');
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  const b = $('#salirM'); let t = null;
  const soltar = () => { clearTimeout(t); b.classList.remove('carga'); };
  b.addEventListener('pointerdown', (ev) => { ev.preventDefault(); b.classList.add('carga'); t = setTimeout(() => { soltar(); if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {}); ir('canjear'); }, 1500); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((e) => b.addEventListener(e, soltar));
  b.addEventListener('contextmenu', (ev) => ev.preventDefault());
}
function pantallaCompleta() {
  document.body.classList.toggle('full');
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && pestaña !== 'mostrador') document.body.classList.remove('full'); });

/* ---------- Canjear ---------- */
function canjear() {
  $('#cont').innerHTML = `<div id="encab"><h2 class="tit">${MODO() === 'cliente' ? 'Canjear' : 'Escanear cliente'}</h2><p class="sub">${MODO() === 'cliente' ? 'Premios, regalos de cumpleaños y tarjetas de regalo se canjean igual: escanea el QR del cliente o escribe su código.' : 'Busca al cliente por su WhatsApp o escanea el QR de su tarjeta. Las tarjetas de regalo también se escanean aquí.'}</p></div>
    <div class="grid2" id="buscador"><div class="tarjeta"><div id="lector"></div><p class="nota" id="camnota" style="margin-top:10px">El navegador te va a pedir permiso para usar la cámara.</p>
      <button class="btn claro ancho" id="camBtn" style="margin-top:10px" onclick="iniciarLector()">Abrir cámara</button></div>
    <div>${MODO() !== 'cliente' ? `<div class="tarjeta" style="margin-bottom:16px"><label for="bq">Buscar por WhatsApp o nombre</label><input id="bq" inputmode="search" autocomplete="off" placeholder="Ej. 6123 o Carla">
      <ul class="lista" id="bres"></ul></div>` : ''}
      <div class="tarjeta"><label for="cod">${MODO() !== 'cliente' ? 'O escribe el código de su tarjeta' : 'Código del cliente'}</label><input id="cod" class="codigo-in" maxlength="6" autocomplete="off" placeholder="······">
      <button class="btn ancho" style="margin-top:12px" onclick="buscar($('#cod').value)">Buscar</button></div></div></div>
    <div id="res" class="res-solo"></div>`;
  // Cuando aparece un cliente (o una tarjeta de regalo) se oculta todo lo de buscar; «Siguiente cliente» lo vuelve a mostrar.
  new MutationObserver(() => { const hay = $('#res') && $('#res').innerHTML.trim() !== ''; const b = $('#buscador'); if (!b) return; b.classList.toggle('oculto', hay); $('#encab').classList.toggle('oculto', hay); if (hay) { detenerLector(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }).observe($('#res'), { childList: true });
  $('#cod').addEventListener('keydown', (e) => { if (e.key === 'Enter') buscar(e.target.value); });
  const bq = $('#bq'); if (!bq) return;
  let t = null;
  bq.oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    const q = bq.value.trim(); if (q.length < 2) { $('#bres').innerHTML = ''; return; }
    try {
      const L = await rpc('ficha_buscar', { p_q: q });
      $('#bres').innerHTML = L.length ? L.map((c) => `<li style="cursor:pointer" onclick="abrirFicha('${c.tel}')"><div class="av">${esc(c.nombre.trim()[0])}</div><div class="info"><b>${esc(c.nombre)}</b><span>${telBonito(c.tel)}</span></div><span class="enlace">Abrir</span></li>`).join('')
        : '<li class="vacio">No hay clientes con ese dato. Si es su primera vez, que escanee el QR para crear su tarjeta.</li>';
    } catch (e) { toast(msg(e), 'mal'); }
  }, 250); };
}
async function abrirFicha(tel) {
  try { const f = await rpc('ficha_abrir', { p_tel: tel }); if ($('#bq')) { $('#bq').value = ''; $('#bres').innerHTML = ''; } ficha(f); }
  catch (e) { toast(msg(e), 'mal'); }
}
async function iniciarLector() {
  try {
    lector = new Html5Qrcode('lector');
    await lector.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, (txt) => { detenerLector(); buscar(txt); });
    $('#camBtn').classList.add('oculto'); $('#camnota').textContent = 'Apunta al QR que muestra el cliente.';
  } catch (e) { $('#camnota').textContent = 'No se pudo abrir la cámara. Escribe el código a la derecha.'; lector = null; }
}
async function detenerLector() { if (lector) { try { await lector.stop(); lector.clear(); } catch (e) {} lector = null; } const b = $('#camBtn'); if (b) b.classList.remove('oculto'); }

function nuevoCliente() {
  $('#res').innerHTML = ''; if ($('#cod')) $('#cod').value = '';
  if (MODO() === 'recepcion') { const b = $('#bq'); if (b) b.focus(); } else iniciarLector();

    const e = est(m);
    const txt = e !== 'vencida' ? `Hola ${m.nombre.split(' ')[0]}, tu membresía ${esc(m.nivel || V.nombre || 'del club')} vence el ${fechaCorta(m.hasta)}. ¿Te la renovamos en tu próxima visita?`
      : `Hola ${m.nombre.split(' ')[0]}, extrañamos verte en el ${V.nombre || 'club'}. Si quieres retomar tu membresía, te la activamos en tu próxima visita.`;
    return `<li><div class="av">${esc(m.nombre.trim()[0])}</div><div class="info"><b>${esc(m.nombre)}</b>
      <span>${m.nivel ? esc(m.nivel.replace('Jazmin ', '')) + ' · ' : ''}${e !== 'vencida' ? (m.hasta ? 'hasta el ' + fechaCorta(m.hasta) : 'sin vencimiento') : 'venció el ' + fechaCorta(m.hasta)} · ${m.usos} ${m.usos === 1 ? 'beneficio usado' : 'beneficios usados'}</span></div>
      <span class="estado ${e}">${e === 'vencida' ? 'Vencida' : e === 'pronto' ? (m.dias === 0 ? 'Vence hoy' : `Vence en ${m.dias} d`) : 'Activa'}</span>
      ${e !== 'activa' ? `<a class="wa" style="min-height:36px;padding:0 10px" target="_blank" rel="noopener" href="https://wa.me/${waNum(m.tel)}?text=${encodeURIComponent(txt)}">${e === 'pronto' ? 'Recordar' : 'WhatsApp'}</a>` : ''}</li>`;
  }).join('') : `<li class="vacio">${q ? 'No hay resultados.' : F[FILTRO_V].vacio}</li>`;
}

function pintarPromos() {
  const P = NEG.config.promos || [], hoy = new Date().toISOString().slice(0, 10);
  $('#prs').innerHTML = P.length ? P.map((x, i) => `<li><div class="info"><b>${esc(x.titulo)}</b><span>${esc(x.detalle || '')}${x.hasta ? ' · ' + (x.hasta < hoy ? 'terminó el ' : 'hasta el ') + fechaCorta(x.hasta) : ''}</span></div>
    <button class="enlace" onclick="quitarPromo(${i})">Quitar</button></li>`).join('') : '<li class="vacio">Todavía no hay promociones.</li>';
}
async function guardarPromos(lista) {
  try { NEG.config.promos = await rpc('promos_guardar', { p_promos: lista }); pintarPromos(); toast('Promociones actualizadas', 'ok'); return true; }
  catch (e) { toast(msg(e), 'mal'); return false; }
}
function quitarPromo(i) { const P = [...(NEG.config.promos || [])]; P.splice(i, 1); guardarPromos(P); }


function waNum(t) { t = String(t || '').replace(/\D/g, ''); return t.length <= 8 ? '507' + t : t; }
function textoRegalo(para, de, link) {
  return `Hola ${para}, ${de ? de + ' te regaló' : 'tienes'} una tarjeta de regalo de ${NEG.nombre}. Ábrela aquí: ${link}`;
}
let REGALOS = [], FILTRO_R = 'activas';
function hoyPty() { return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Panama' })).toISOString().slice(0, 10); }
function situacion(g) {
  if (g.estado !== 'activa') return g.estado === 'anulada' ? 'anulada' : 'usada';
  if (!g.vence) return 'activa';
  const dias = Math.round((new Date(g.vence + 'T12:00:00') - new Date(hoyPty() + 'T12:00:00')) / 864e5);
  if (dias < 0) return 'vencida';
  return dias <= 15 ? 'pronto' : 'activa';
}
const diasPara = (v) => Math.round((new Date(v + 'T12:00:00') - new Date(hoyPty() + 'T12:00:00')) / 864e5);
async function listaRegalos() {
  try { REGALOS = (await rpc('panel_resumen')).regalos; pintarRegalos(); }
  catch (e) { $('#lst').innerHTML = `<li class="vacio">${esc(msg(e))}</li>`; }
}
function pintarRegalos() {
  const F = {
    activas: { t: 'Activas', ok: (s) => s === 'activa' || s === 'pronto' },
    pronto: { t: 'Vencen pronto', ok: (s) => s === 'pronto' },
    vencidas: { t: 'Vencidas', ok: (s) => s === 'vencida' },
    usadas: { t: 'Usadas', ok: (s) => s === 'usada' || s === 'anulada' },
    todas: { t: 'Todas', ok: () => true },
  };
  $('#fil').innerHTML = Object.entries(F).map(([k, f]) => `<button class="${k === FILTRO_R ? 'on' : ''}" onclick="FILTRO_R='${k}';pintarRegalos()">${f.t}<i>${REGALOS.filter((g) => f.ok(situacion(g))).length}</i></button>`).join('');
  const L = REGALOS.filter((g) => F[FILTRO_R].ok(situacion(g)));
  const vacio = { activas: 'No hay tarjetas activas.', pronto: 'Ninguna vence en los próximos 15 días.', vencidas: 'No hay tarjetas vencidas.', usadas: 'Todavía no se ha usado ninguna.', todas: 'Todavía no hay tarjetas.' }[FILTRO_R];
  $('#lst').innerHTML = L.length ? L.map((g) => {
    const st = situacion(g), d = g.vence ? diasPara(g.vence) : null;
    const et = { activa: 'Activa', pronto: d === 0 ? 'Vence hoy' : `Vence en ${d} d`, vencida: 'Vencida', usada: 'Usada', anulada: 'Anulada' }[st];
    const cuando = st === 'vencida' ? 'venció el ' + fechaCorta(g.vence) : st === 'usada' || st === 'anulada' ? 'creada el ' + fechaCorta(g.creado) : g.vence ? 'vence el ' + fechaCorta(g.vence) : 'sin vencimiento';
    const txt = st === 'pronto' ? `Hola ${g.para}, te recordamos que tu tarjeta de regalo de ${NEG.nombre} vence el ${fechaCorta(g.vence)}. ¿Te agendamos tu cita? ${BASE}regalo/?g=${g.codigo}` : textoRegalo(g.para, g.de, BASE + 'regalo/?g=' + g.codigo);
    return `<li class="rg"><div class="info"><b>Para ${esc(g.para)}</b>
      <span>${g.de ? 'De ' + esc(g.de) + ' · ' : ''}${g.tipo === 'servicio' ? esc(g.servicio) : 'quedan ' + dinero(g.saldo) + ' de ' + dinero(g.monto)} · ${cuando}</span></div>
      <div class="rg-acc"><span class="estado ${st === 'anulada' ? 'usada' : st}">${et}</span>
      ${g.tel && (st === 'activa' || st === 'pronto') ? `<a class="wa" style="min-height:36px;padding:0 10px" target="_blank" rel="noopener" href="https://wa.me/${waNum(g.tel)}?text=${encodeURIComponent(txt)}">${st === 'pronto' ? 'Recordar' : 'Reenviar'}</a>` : ''}
      <a class="enlace" target="_blank" href="${BASE}regalo/?g=${g.codigo}">Ver</a></div></li>`;
  }).join('') : `<li class="vacio">${vacio}</li>`;
}

iniciar();
</script>
